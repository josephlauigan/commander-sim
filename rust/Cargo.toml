[workspace]
resolver = "2"
members = ["crates/sim-core", "crates/sim-py", "crates/practice"]

[workspace.package]
edition = "2024"
version = "0.1.0"
publish = false

[profile.release]
debug = 1          # line tables for profiling
overflow-checks = true  # a counter that wraps panics instead of growing a Vec to 60 GB (Deadly Dispute, 10/10)
