[package]
name = "cardgen"
version = "0.1.0"
edition = "2024"
description = "Card data and deck lists without Python: builds data/cards.json and data/decks.json, edits decks, audits cards"

[lib]
path = "src/lib.rs"

[[bin]]
name = "cardgen"
path = "src/main.rs"

[dependencies]
sim-core = { version = "0.1.0", path = "../sim-core" }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
fancy-regex = "0.14"
toml = { version = "0.8", features = ["preserve_order"] }
unicode-normalization = "0.1"
ureq = "2"
chrono = { version = "0.4", default-features = false, features = ["clock"] }
