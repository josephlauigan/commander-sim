[package]
name = "sim-cli"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true
description = "commander-sim: the simulator's run harness (pool runs, paired swaps, calibration, analysis, traces)"

[[bin]]
name = "commander-sim"
path = "src/main.rs"

[dependencies]
cardgen = { version = "0.1.0", path = "../cardgen" }
sim-core = { version = "0.1.0", path = "../sim-core" }
serde_json = "1.0.151"
toml = "0.8"
