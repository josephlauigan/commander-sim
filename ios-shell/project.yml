# The Xcode project, generated by XcodeGen (brew install xcodegen; then xcodegen generate). run.sh does both.
name: CommanderPractice
options:
  bundleIdPrefix: com.josephlauigan
  deploymentTarget:
    iOS: "17.0"
targets:
  CommanderPractice:
    type: application
    platform: iOS
    sources:
      - App
      - path: Resources
        type: folder
        buildPhase: resources
    dependencies:
      - framework: build/PracticeCore.xcframework
        embed: false
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.josephlauigan.commander-practice
        TARGETED_DEVICE_FAMILY: "2"
        SWIFT_VERSION: "5.0"
        CODE_SIGN_STYLE: Automatic
    info:
      path: build/Info.plist
      properties:
        CFBundleDisplayName: Commander Practice
        UIRequiresFullScreen: true
        UIStatusBarHidden: true
        UILaunchScreen: {}
        UISupportedInterfaceOrientations~ipad: [UIInterfaceOrientationLandscapeLeft, UIInterfaceOrientationLandscapeRight, UIInterfaceOrientationPortrait, UIInterfaceOrientationPortraitUpsideDown]
        # the web view loads the table from the server inside the app (http://127.0.0.1)
        NSAppTransportSecurity:
          NSAllowsLocalNetworking: true
