# data/ownership.toml: JD's record of which cards of his decks he has, plays as a proxy or is missing.
# Statuses for the five decks come from JD's own lists of 2026-11-22 (each card marked Have or proxy; none missing), and each
# deck is confirmed. A `have` card in k decks carries `copies = k`: JD marked a copy for each deck.
# 2026-11-23 (JD): the Arzakon, Yoshimaru, Ur-Dragon and Y'shtola swaps moved cards between decks; he owns every incoming card
# except Hellkite Courser (a proxy), and the freed Mind Stone copy is a spare.
# 2026-11-23 (JD, from his deck export): Talisman of Hierarchy moved from the Arzakon deck to the Ur-Dragon deck (Hellkite Courser left
# the Ur-Dragon deck); Kyodai, Soul of Kamigawa moved from the Arzakon deck to the Ur-Dragon deck in place of Klauth, Unrivaled Ancient
# (a proxy, now out); Dockside Extortionist and Karn Liberated joined the Arzakon deck, and he has both.
# 2026-11-24 (JD): the Ur-Dragon speed and protection/draw packages (eight pairs) and Cabal Ritual => Deadly Rollick in the Sheoldred deck.
# 2026-11-24 (JD): he no longer owns Palantír of Orthanc or Y'shtola, Night's Blessed; both left the spare list.
# 2026-11-24 (JD): the Karn, Gilded Guardian deck replaces the Y'shtola and Yoshimaru/Tymna decks (both retired). A card JD owned in a retired deck
# (or in the spare list) and that is in the Karn list is `have` in the Karn deck; every card whose owned copy stays in the Arzakon deck, the Ur-Dragon
# deck or the Sheoldred deck, and every new card, is `proxy` there (JD: "they will be proxies"). The retired decks' other owned cards are spares.
# Mithril Coat, Giver of Runes, Tymna, Deadly Rollick, The Theorist and Sapphire Medallion (entered as proxy in the Ur-Dragon and Sheoldred decks while
# their donor decks lived) are now `have` there. The Karn deck was unconfirmed until 2026-11-25 (see below).
# 2026-11-24 (JD): Karn deck list change: Deflecting Swat and Generous Gift out (owned, now spares), Yoshimaru, Ever Faithful in as `have` and Giver of Runes in as `proxy` (JD owns one Giver of Runes: it stays `have` in the Ur-Dragon).
# 2026-11-24 (JD): Esper Sentinel moved from the Arzakon deck to the Karn deck in place of Felidar Guardian (a proxy, now out); Arzakon took Reality Shift (owned) and, for three proxy fetchlands, the Urza lands Tower, Mine and Power Plant (JD confirmed on 2026-11-24 that he owns them: `have`; his printings are not known).
# 2026-11-24 (JD): Karn deck: Birthing Pod in for Shorikai, Genesis Engine (a proxy, now out); JD owns no Birthing Pod, so it is `proxy`.
# 2026-11-24 (JD): Ur-Dragon deck: Rhythm of the Wild (his copy, from the spare list) in for Hellkite Courser (a proxy, now out).
# 2026-11-24 (JD): Karn deck: Conjurer's Closet (his copy, from the spare list) in for Cloudshift (a proxy, now out).
# 2026-11-24 (JD): Ur-Dragon deck: Minas Tirith (his copy, from the spare list) in for the one basic Forest (basic lands are never listed).
# 2026-11-24 (JD): Arzakon deck: Sunpearl Kirin (his copy, from the spare list) in for Rhystic Study (a proxy in this deck, now out).
# 2026-11-25 (JD): Arzakon deck: Karn's Bastion (his copy) in for Strip Mine (his copy, now a spare).
# 2026-11-25 (JD, from his lists of the Arzakon, Karn, Ur-Dragon and Sheoldred decks): Mox Opal (Arzakon), Dragonlord Dromoka, Dragonspeaker Shaman,
# Smaug the Magnificent and Talisman of Curiosity (Ur-Dragon) and Diabolic Tutor (Sheoldred) are now `have`; Arcane Signet and Sol Ring are `have` in the Ur-Dragon
# deck too, so they carry copies = 4 and 3 and the spare copy of each is in a deck (Diabolic Tutor's spare copy went into the Sheoldred deck). In the Karn deck
# Breya, Etherium Shaper, Karn, Gilded Guardian, The Mind Stone, The Soul Stone and Thought Vessel are `have`; JD sold his copies of Adarkar Wastes, Overgrown Tomb,
# Temple Garden and Vito, Thorn of the Dusk Rose (now `proxy`; a sold copy is gone, not a spare) and of Blood Crypt; the 18 cards he marked Getting are `missing` (17 after 2026-11-25).
# 2026-11-25 (JD): the Karn deck is confirmed: his list of that day marks every card (Have, proxy or Getting; Getting is recorded as `missing`).
# 2026-11-25 (JD): Karn deck: The Fire Crystal (his copy) in for The Wind Crystal (one of the cards he was getting, so it leaves the `missing` list).
# 2026-11-25 (JD, his final Karn list): Birthing Pod and Transguild Courier leave the Karn deck (he no longer plans to get them: they are in no other deck and not in [spare]); Dread Tiller (ecc 40) and Iron Man, Armored Avenger (msc 33) come in as `have`. Baleful Strix, Infinite Guideline Station, The Reaper, King No More and Reliquary Tower are now `have` (he has them); the 11 other cards he was getting are `proxy`. The Karn deck has no `missing` card.
# 2026-11-26 (JD): Arzakon mana package: Llanowar Elves, Avacyn's Pilgrim, Exsanguinate and Coalition Relic out (his owned copies are now spares; the Exsanguinate copy no longer in the Arzakon deck is a spare; Coalition Relic's owned copy stays in the Karn deck: copies = 1 there), Mana Confluence, City of Brass, Misty Rainforest and Chromatic Lantern in as `proxy` (JD: "I will proxy as needed"; his owned City of Brass stays in the Ur-Dragon deck). Meteor Golem stays (JD).
# 2026-11-26 (JD): Ur-Dragon: Elvish Mystic out for Avacyn's Pilgrim (both owned: the Pilgrim leaves the spares, the Mystic joins them).
# A deck without `confirmed` is unconfirmed: treat its statuses as unknown.
# Checked by `cardgen ownership --check`. Basic lands are never listed.

