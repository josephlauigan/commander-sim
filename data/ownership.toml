# data/ownership.toml: JD's record of which cards of his decks he has, plays as a proxy or is missing.
# Statuses for the five decks come from JD's own lists of 2026-11-22 (each card marked Have or proxy; none missing), and each
# deck is confirmed. A `have` card in k decks carries `copies = k`: JD marked a copy for each deck.
# 2026-11-23 (JD): the Arzakon, Yoshimaru, Ur-Dragon and Y'shtola swaps moved cards between decks; he owns every incoming card
# except Hellkite Courser (a proxy), and the freed Mind Stone copy is a spare.
# 2026-11-23 (JD, from his deck export): Talisman of Hierarchy moved from the Arzakon deck to the Ur-Dragon deck (Hellkite Courser left
# the Ur-Dragon deck); Kyodai, Soul of Kamigawa moved from the Arzakon deck to the Ur-Dragon deck in place of Klauth, Unrivaled Ancient
# (a proxy, now out); Dockside Extortionist and Karn Liberated joined the Arzakon deck, and he has both.
# 2026-11-24 (JD): the Ur-Dragon speed and protection/draw packages (eight pairs) and Cabal Ritual => Deadly Rollick in the Sheoldred deck.
# 2026-11-24 (JD): the Karn, Gilded Guardian deck replaces the Y'shtola and Yoshimaru/Tymna decks (both retired). A card JD owned in a retired deck
# (or in the spare list) and that is in the Karn list is `have` in the Karn deck; every card whose owned copy stays in the Arzakon deck, the Ur-Dragon
# deck or the Sheoldred deck, and every new card, is `proxy` there (JD: "they will be proxies"). The retired decks' other owned cards are spares.
# Mithril Coat, Giver of Runes, Tymna, Deadly Rollick, The Theorist and Sapphire Medallion (entered as proxy in the Ur-Dragon and Sheoldred decks while
# their donor decks lived) are now `have` there. The Karn deck is unconfirmed: JD has not marked its cards one by one.
# 2026-11-24 (JD): Karn deck list change: Deflecting Swat and Generous Gift out (owned, now spares), Yoshimaru, Ever Faithful in as `have` and Giver of Runes in as `proxy` (JD owns one Giver of Runes: it stays `have` in the Ur-Dragon).
# A deck without `confirmed` is unconfirmed: treat its statuses as unknown.
# Checked by `cardgen ownership --check`. Basic lands are never listed.

