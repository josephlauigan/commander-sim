# Realism targets, Tier 5 (High Bracket 4): what real games look like, for `commander-sim --realism --pool t5`.
# Format: see t6.toml. Bands (JD, 2026-10-23): every share is held to its real value +/- 1 point.
#
# Source: Playgroup.gg (stats CC BY 4.0, https://playgroup.gg/legal), read 2026-10-24, matched to this tier's five
# pool commanders (data/decks.json): Kinnan, Bonder Prodigy (1296), Urza, Lord High Artificer (2109), Winota,
# Joiner of Forces (24), Yawgmoth, Thran Physician (1474) and Zur the Enchanter (1944).
#
# Each commander counts the same, as in t3.toml: every target is the plain average of the five commanders' own figures,
# as the sim seats each pool deck equally often.
#
# Caveats: a commander's numbers cover every deck built around it, at any power level, so they give the shape of a
# tier's games more than its level. They are casual pods logged by players, of any size (3 to 6 players). The two
# Playgroup sources count games differently (commanders.json against each commander's page and stats), so the
# samples below differ.

tier = "t5"

# --- Seat win rates: each commander's page (https://playgroup.gg/commanders/<id>, "Does seating order matter?")
# gives its win rate from seats 1-4 and the games behind each. Seats 1-4 win, on average over the five commanders,
# 44.5 / 38.6 / 32.2 / 25.7% of their games; each rate divided by the four rates' total gives the share of decisive
# games, as the sim counts them.

[seat1_win]
value = 31.5
lo = 30.5
hi = 32.5
n = 16134
source = "Playgroup commander pages, seat win rates of Kinnan, Urza, Winota, Yawgmoth, Zur (equal weight), share of seat wins"
date = "2026-10-24"
note = "n = seat-games behind the five commanders' seat 1-4 rates"

[seat2_win]
value = 27.4
lo = 26.4
hi = 28.4
n = 16134
source = "Playgroup commander pages, seat win rates of Kinnan, Urza, Winota, Yawgmoth, Zur (equal weight), share of seat wins"
date = "2026-10-24"

[seat3_win]
value = 22.8
lo = 21.8
hi = 23.8
n = 16134
source = "Playgroup commander pages, seat win rates of Kinnan, Urza, Winota, Yawgmoth, Zur (equal weight), share of seat wins"
date = "2026-10-24"

[seat4_win]
value = 18.2
lo = 17.2
hi = 19.2
n = 16134
source = "Playgroup commander pages, seat win rates of Kinnan, Urza, Winota, Yawgmoth, Zur (equal weight), share of seat wins"
date = "2026-10-24"

# --- Speed: Playgroup gives each commander's average win turn (https://playgroup.gg/api/public/v1/commanders/<id>.json,
# stats.average_wins_by_turn): Kinnan 6, Urza 7, Winota 7, Yawgmoth 7, Zur 9; their average is 7.2. An average,
# not a median, and no spread: win_round_spread has no target.

[win_round_median]
value = 7
lo = 6
hi = 8
n = 6305
source = "Playgroup commander stats, average win turn of Kinnan, Urza, Winota, Yawgmoth, Zur (equal weight)"
date = "2026-10-24"
note = "n = the five commanders' logged wins; Playgroup gives an average win turn (7.2), used as the median"

# --- How games are won: Playgroup commanders.json (https://playgroup.gg/api/public/v1/commanders.json), each
# commander's wins by type, averaged over the five: combat and other damage 51.1%, combo, alternate win and mill
# 37.7%, commander damage 9.0%, poison 2.2%. Per commander (damage / combo / commander damage):
# Kinnan 42 / 56 / 2; Urza 44 / 53 / 1;
# Winota 90 / 7 / 3; Yawgmoth 52 / 44 / 0;
# Zur 28 / 29 / 39.
# Grouped as t6.toml groups them.

[win_damage]
value = 51.1
lo = 50.1
hi = 52.1
n = 3095
source = "Playgroup commanders.json, wins of Kinnan, Urza, Winota, Yawgmoth, Zur (equal weight)"
date = "2026-10-24"

[win_combo_alt]
value = 37.7
lo = 36.7
hi = 38.7
n = 3095
source = "Playgroup commanders.json, wins of Kinnan, Urza, Winota, Yawgmoth, Zur (equal weight)"
date = "2026-10-24"

[win_commander_damage]
value = 9.0
lo = 8.0
hi = 10.0
n = 3095
source = "Playgroup commanders.json, wins of Kinnan, Urza, Winota, Yawgmoth, Zur (equal weight)"
date = "2026-10-24"

[win_poison]
value = 2.2
lo = 1.2
hi = 3.2
n = 3095
source = "Playgroup commanders.json, wins of Kinnan, Urza, Winota, Yawgmoth, Zur (equal weight)"
date = "2026-10-24"

# --- No target yet:
# - deck_win_spread: Playgroup's win rates (Kinnan 38%, Urza 36%, Winota 38%, Yawgmoth 37%, Zur 32% of games) are
#   against whatever their pods held, not against each other, so their gap is not the sim's gap.
# - games_over_15 and win_round_spread: Playgroup publishes no distribution of game or win length.
