# Realism targets, Tier 4 (Low Bracket 4): what real games look like, for `commander-sim --realism --pool t4`.
# Format: see t6.toml. Bands (JD, 2026-10-23): every share is held to its real value +/- 1 point.
#
# Source: Playgroup.gg (stats CC BY 4.0, https://playgroup.gg/legal), read 2026-10-24, matched to this tier's five
# pool commanders (data/decks.json): Chulane, Teller of Tales (2143), Heliod, Sun-Crowned (901), Krenko,
# Mob Boss (954), Prosper, Tome-Bound (287) and Yuriko, the Tiger's Shadow (1528).
#
# Each commander counts the same, as in t3.toml: every target is the plain average of the five commanders' own figures,
# as the sim seats each pool deck equally often.
#
# Caveats: a commander's numbers cover every deck built around it, at any power level, so they give the shape of a
# tier's games more than its level. They are casual pods logged by players, of any size (3 to 6 players). The two
# Playgroup sources count games differently (commanders.json against each commander's page and stats), so the
# samples below differ.

tier = "t4"

# --- Seat win rates: each commander's page (https://playgroup.gg/commanders/<id>, "Does seating order matter?")
# gives its win rate from seats 1-4 and the games behind each. Seats 1-4 win, on average over the five commanders,
# 43.3 / 37.2 / 29.4 / 24.3% of their games; each rate divided by the four rates' total gives the share of decisive
# games, as the sim counts them.

[seat1_win]
value = 32.3
lo = 31.3
hi = 33.3
n = 31120
source = "Playgroup commander pages, seat win rates of Chulane, Heliod, Krenko, Prosper, Yuriko (equal weight), share of seat wins"
date = "2026-10-24"
note = "n = seat-games behind the five commanders' seat 1-4 rates"

[seat2_win]
value = 27.7
lo = 26.7
hi = 28.7
n = 31120
source = "Playgroup commander pages, seat win rates of Chulane, Heliod, Krenko, Prosper, Yuriko (equal weight), share of seat wins"
date = "2026-10-24"

[seat3_win]
value = 21.9
lo = 20.9
hi = 22.9
n = 31120
source = "Playgroup commander pages, seat win rates of Chulane, Heliod, Krenko, Prosper, Yuriko (equal weight), share of seat wins"
date = "2026-10-24"

[seat4_win]
value = 18.1
lo = 17.1
hi = 19.1
n = 31120
source = "Playgroup commander pages, seat win rates of Chulane, Heliod, Krenko, Prosper, Yuriko (equal weight), share of seat wins"
date = "2026-10-24"

# --- Speed: Playgroup gives each commander's average win turn (https://playgroup.gg/api/public/v1/commanders/<id>.json,
# stats.average_wins_by_turn): Chulane 8, Heliod 9, Krenko 7, Prosper 8, Yuriko 7; their average is 7.8. An average,
# not a median, and no spread: win_round_spread has no target.

[win_round_median]
value = 8
lo = 7
hi = 9
n = 11156
source = "Playgroup commander stats, average win turn of Chulane, Heliod, Krenko, Prosper, Yuriko (equal weight)"
date = "2026-10-24"
note = "n = the five commanders' logged wins; Playgroup gives an average win turn (7.8), used as the median"

# --- How games are won: Playgroup commanders.json (https://playgroup.gg/api/public/v1/commanders.json), each
# commander's wins by type, averaged over the five: combat and other damage 77.3%, combo, alternate win and mill
# 19.9%, commander damage 2.7%, poison 0.1%. Per commander (damage / combo / commander damage):
# Chulane 66 / 30 / 3; Heliod 73 / 21 / 6;
# Krenko 89 / 9 / 2; Prosper 76 / 23 / 1;
# Yuriko 82 / 16 / 1.
# Grouped as t6.toml groups them.

[win_damage]
value = 77.3
lo = 76.3
hi = 78.3
n = 5935
source = "Playgroup commanders.json, wins of Chulane, Heliod, Krenko, Prosper, Yuriko (equal weight)"
date = "2026-10-24"

[win_combo_alt]
value = 19.9
