# Realism targets, Tier 4 (Low Bracket 4): what real games look like, for `commander-sim --realism --pool t4`.
# Format: see t6.toml. Bands (JD, 2026-10-23; widened to 1.5 on 2026-10-26): every share is held to its real
# value +/- 1.5 points.
#
# Source: Playgroup.gg (stats CC BY 4.0, https://playgroup.gg/legal), read 2026-10-24 (Edgar Markov 2026-10-25),
# matched to this tier's five
# pool commanders (data/decks.json): Chulane, Teller of Tales (2143), Edgar Markov (596), Krenko, Mob Boss (954),
# Prosper, Tome-Bound (287) and Yuriko, the Tiger's Shadow (1528).
#
# Each commander counts the same, as in t3.toml: every target is the plain average of the five commanders' own figures,
# as the sim seats each pool deck equally often.
#
# History: Edgar Markov replaced Heliod, Sun-Crowned on 2026-10-25 (JD): EDHREC's bracket-4 Heliod list is a Walking
# Ballista combo deck, while Playgroup's Heliod is mostly casual life gain, so its target and list described different
# decks. With Heliod the targets were seats 32.3 / 27.7 / 21.9 / 18.1, win turn 7.8, damage 77.3%, combo 19.9%.
#
# Caveats: a commander's numbers cover every deck built around it, at any power level, so they give the shape of a
# tier's games more than its level. They are casual pods logged by players, of any size (3 to 6 players). The two
# Playgroup sources count games differently (commanders.json against each commander's page and stats), so the
# samples below differ.

tier = "t4"

# --- Seat win rates: each commander's page (https://playgroup.gg/commanders/<id>, "Does seating order matter?")
# gives its win rate from seats 1-4 and the games behind each. Seats 1-4 win, on average over the five commanders,
# 42.8 / 36.3 / 28.2 / 23.3% of their games; each rate divided by the four rates' total gives the share of decisive
# games, as the sim counts them.

[seat1_win]
value = 32.8
lo = 31.3
hi = 34.3
n = 44123
source = "Playgroup commander pages, seat win rates of Chulane, Edgar, Krenko, Prosper, Yuriko (equal weight), share of seat wins"
date = "2026-10-25"
note = "n = seat-games behind the five commanders' seat 1-4 rates"

[seat2_win]
value = 27.8
lo = 26.3
hi = 29.3
n = 44123
source = "Playgroup commander pages, seat win rates of Chulane, Edgar, Krenko, Prosper, Yuriko (equal weight), share of seat wins"
date = "2026-10-25"

[seat3_win]
value = 21.6
lo = 20.1
hi = 23.1
n = 44123
source = "Playgroup commander pages, seat win rates of Chulane, Edgar, Krenko, Prosper, Yuriko (equal weight), share of seat wins"
date = "2026-10-25"

[seat4_win]
value = 17.9
lo = 16.4
hi = 19.4
n = 44123
source = "Playgroup commander pages, seat win rates of Chulane, Edgar, Krenko, Prosper, Yuriko (equal weight), share of seat wins"
date = "2026-10-25"

# --- Speed: Playgroup gives each commander's average win turn (https://playgroup.gg/api/public/v1/commanders/<id>.json,
# stats.average_wins_by_turn): Chulane 8, Edgar 9, Krenko 7, Prosper 8, Yuriko 7; their average is 7.8. An average,
# not a median, and no spread: win_round_spread has no target.

[win_round_median]
value = 8
lo = 7
hi = 9
n = 15302
source = "Playgroup commander stats, average win turn of Chulane, Edgar, Krenko, Prosper, Yuriko (equal weight)"
date = "2026-10-25"
note = "n = the five commanders' logged wins; Playgroup gives an average win turn (7.8), used as the median"

# --- How games are won: Playgroup commanders.json (https://playgroup.gg/api/public/v1/commanders.json), each
# commander's wins by type, averaged over the five: combat and other damage 79.7%, combo, alternate win and mill
# 17.9%, commander damage 2.2%, poison 0.1%. Per commander (damage / combo / commander damage):
# Chulane 66 / 30 / 3; Edgar 85 / 11 / 4;
# Krenko 89 / 9 / 2; Prosper 76 / 23 / 1;
# Yuriko 82 / 16 / 1.
# Grouped as t6.toml groups them. References, not scored (JD, 2026-10-25), as in t6.toml: the pool lists are
# EDHREC's bracket-4 decks, built around their combos and engines, while these commanders' Playgroup wins mix every
# build at every power level (audit/realism/t45-targets-2026-10-24.md).

[win_damage]
value = 79.7
lo = 78.2
hi = 81.2
n = 8113
source = "Playgroup commanders.json, wins of Chulane, Edgar, Krenko, Prosper, Yuriko (equal weight)"
date = "2026-10-25"
scored = false

[win_combo_alt]
value = 17.9
lo = 16.4
hi = 19.4
n = 8113
source = "Playgroup commanders.json, wins of Chulane, Edgar, Krenko, Prosper, Yuriko (equal weight)"
date = "2026-10-25"
scored = false

[win_commander_damage]
