# Realism targets, Tier 3 (High Bracket 3): what real games look like, for `commander-sim --realism --pool t3`.
# Format: see t6.toml. Bands (JD, 2026-10-23; widened to 1.5 on 2026-10-26): every share is held to its real
# value +/- 1.5 points.
#
# Source: Playgroup.gg (stats CC BY 4.0, https://playgroup.gg/legal), read 2026-10-24, matched to this tier's five
# pool commanders (data/decks.json): Atraxa, Praetors' Voice (1171), Aurelia, the Warleader (139), Korvold,
# Fae-Cursed King (1415), Marwyn, the Nurturer (2162) and Tergrid, God of Fright (1215).
#
# Each commander counts the same (2026-10-24, when Atraxa rejoined at JD's request; the weighting is the main session's
# choice): every target is the plain average of the five commanders' own figures, as the sim seats each pool deck
# equally often. Pooled by logged games instead, Atraxa (1,837 of the five's 3,709 wins) would be half of every target.
# Pooled figures, for comparison: seats 33.0 / 27.4 / 21.8 / 17.9, win turn 8.5, damage 46.7%, combo and alternate
# 16.3%, commander damage 14.3%, poison 22.6%.
#
# History: until 2026-10-24 Atraxa was left out (the pool's Atraxa was superfriends, while 45% of Playgroup's Atraxa
# wins are poison) and the other four were pooled: seats 31.3 / 27.8 / 21.8 / 19.1, win turn 8.1, damage 62.2%, combo
# and alternate 20.0%, commander damage 17.4%, poison 0.4%. The pool's Atraxa is now EDHREC's bracket-3 infect list
# (atraxa-infect), so it rejoined.
#
# Caveats: a commander's numbers cover every deck built around it, at any power level, so they give the shape of a
# tier's games more than its level. They are casual pods logged by players, of any size (3 to 6 players). The two
# Playgroup sources count games differently (Aurelia: 566 games in commanders.json, 1,207 on her page and in her
# stats), so the samples below differ.

tier = "t3"

# --- Seat win rates: each commander's page (https://playgroup.gg/commanders/<id>-<slug>, "Does seating order
# matter?") gives its win rate from seats 1-4 and the games behind each. Seats 1-4 win, on average over the five
# commanders, 40.1 / 34.4 / 27.4 / 22.3% of their games (Atraxa 41.5 / 32.2 / 25.9 / 19.9); each rate divided by the
# four rates' total gives the share of decisive games, as the sim counts them. (Playgroup's all-games turn-order page,
# 284,950 4-player single-winner games at every power level, gives 29.2 / 25.7 / 23.6 / 21.5: a smaller seat-1 edge
# than these commanders show.)

[seat1_win]
value = 32.3
lo = 30.8
hi = 33.8
n = 21059
source = "Playgroup commander pages, seat win rates of Atraxa, Aurelia, Korvold, Marwyn, Tergrid (equal weight), share of seat wins"
date = "2026-10-24"
note = "n = seat-games behind the five commanders' seat 1-4 rates"

[seat2_win]
value = 27.7
lo = 26.2
hi = 29.2
n = 21059
source = "Playgroup commander pages, seat win rates of Atraxa, Aurelia, Korvold, Marwyn, Tergrid (equal weight), share of seat wins"
date = "2026-10-24"

[seat3_win]
value = 22.0
lo = 20.5
hi = 23.5
n = 21059
source = "Playgroup commander pages, seat win rates of Atraxa, Aurelia, Korvold, Marwyn, Tergrid (equal weight), share of seat wins"
date = "2026-10-24"

[seat4_win]
value = 18.0
lo = 16.5
hi = 19.5
n = 21059
source = "Playgroup commander pages, seat win rates of Atraxa, Aurelia, Korvold, Marwyn, Tergrid (equal weight), share of seat wins"
date = "2026-10-24"

# --- Speed: Playgroup gives each commander's average win turn (https://playgroup.gg/api/public/v1/commanders/<id>.json,
# stats.average_wins_by_turn): Atraxa 9, Aurelia 9, Korvold 8, Marwyn 7, Tergrid 9; their average is 8.4. An average,
# not a median, and no spread: win_round_spread has no target. commanders.json's average_round_amount is the length of
# every game played, won or not, so it is not used.

[win_round_median]
value = 8
lo = 7
hi = 9
n = 7223
source = "Playgroup commander stats, average win turn of Atraxa, Aurelia, Korvold, Marwyn, Tergrid (equal weight)"
date = "2026-10-24"
note = "n = the five commanders' logged wins; Playgroup gives an average win turn (8.4), used as the median"

# --- How games are won: Playgroup commanders.json (https://playgroup.gg/api/public/v1/commanders.json), each
# commander's wins by type, averaged over the five: combat and other damage 59.8%, combo, alternate win and mill 16.5%,
# commander damage 14.4%, poison 9.3% (Atraxa: 30.9 / 12.5 / 11.2 / 45.3% of its 1,837 wins; the other four 0-1%
# poison). Grouped as t6.toml groups them.

[win_damage]
value = 59.8
lo = 58.3
hi = 61.3
n = 3709
source = "Playgroup commanders.json, wins of Atraxa, Aurelia, Korvold, Marwyn, Tergrid (equal weight)"
date = "2026-10-24"

[win_combo_alt]
value = 16.5
lo = 15.0
hi = 18.0
n = 3709
source = "Playgroup commanders.json, wins of Atraxa, Aurelia, Korvold, Marwyn, Tergrid (equal weight)"
date = "2026-10-24"

[win_commander_damage]
value = 14.4
lo = 12.9
hi = 15.9
n = 3709
source = "Playgroup commanders.json, wins of Atraxa, Aurelia, Korvold, Marwyn, Tergrid (equal weight)"
date = "2026-10-24"

[win_poison]
value = 9.3
lo = 7.8
hi = 10.8
n = 3709
source = "Playgroup commanders.json, wins of Atraxa, Aurelia, Korvold, Marwyn, Tergrid (equal weight)"
date = "2026-10-24"

# --- No target yet:
# - deck_win_spread: Playgroup's win rates (Atraxa 32.1%, Aurelia 32.4%, Korvold 34.8%, Marwyn 37.8%, Tergrid 26.2%
#   of games) are against whatever their pods held, not against each other, so their gap is not the sim's gap.
# - games_over_15 and win_round_spread: Playgroup publishes no distribution of game or win length.
