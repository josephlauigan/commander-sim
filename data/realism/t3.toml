# Realism targets, Tier 3 (High Bracket 3): what real games look like, for `commander-sim --realism --pool t3`.
# Format: see t6.toml. Bands (JD, 2026-10-23): every share is held to its real value +/- 1 point.
#
# Source: Playgroup.gg (stats CC BY 4.0, https://playgroup.gg/legal), read 2026-10-24, matched to this tier's pool
# commanders (data/decks.json): Aurelia, the Warleader (139), Korvold, Fae-Cursed King (1415), Marwyn, the Nurturer
# (2162) and Tergrid, God of Fright (1215).
#
# Atraxa, Praetors' Voice (1171), the fifth pool commander, is left out of every target: 833 of its 1,837 logged wins
# (45%) are poison, from infect and proliferate builds, while this tier's Atraxa is superfriends. With it the poison
# target would be 22.6%. Its seat shares are close to the other four (34.7 / 27.0 / 21.7 / 16.6), so leaving it out
# moves the seat targets by under 2 points.
#
# Caveats: a commander's numbers cover every deck built around it, at any power level, so they give the shape of a
# tier's games more than its level. They are casual pods logged by players, of any size (3 to 6 players). The two
# Playgroup sources count games differently (Aurelia: 566 games in commanders.json, 1,207 on her page and in her
# stats), so the samples below differ.

tier = "t3"

# --- Seat win rates: each commander's page (https://playgroup.gg/commanders/<id>-<slug>, "Does seating order
# matter?") gives its win rate from seats 1-4 and the games behind each. Wins pooled over the four commanders: seats
# 1-4 win 40.1 / 35.6 / 28.0 / 24.4% of their games; each rate divided by the four rates' total gives the share of
# decisive games, as the sim counts them. (Playgroup's all-games turn-order page, 284,950 4-player single-winner games
# at every power level, gives 29.2 / 25.7 / 23.6 / 21.5: a smaller seat-1 edge than these commanders show.)

[seat1_win]
value = 31.3
lo = 30.3
hi = 32.3
n = 10691
source = "Playgroup commander pages, seat win rates of Aurelia, Korvold, Marwyn, Tergrid, share of seat wins"
date = "2026-10-24"
note = "n = seat-games behind the four commanders' seat 1-4 rates"

[seat2_win]
value = 27.8
lo = 26.8
hi = 28.8
n = 10691
source = "Playgroup commander pages, seat win rates of Aurelia, Korvold, Marwyn, Tergrid, share of seat wins"
date = "2026-10-24"

[seat3_win]
value = 21.8
lo = 20.8
hi = 22.8
n = 10691
source = "Playgroup commander pages, seat win rates of Aurelia, Korvold, Marwyn, Tergrid, share of seat wins"
date = "2026-10-24"

[seat4_win]
value = 19.1
lo = 18.1
hi = 20.1
n = 10691
source = "Playgroup commander pages, seat win rates of Aurelia, Korvold, Marwyn, Tergrid, share of seat wins"
date = "2026-10-24"

# --- Speed: Playgroup gives each commander's average win turn (https://playgroup.gg/api/public/v1/commanders/<id>.json,
# stats.average_wins_by_turn): Aurelia 9, Korvold 8, Marwyn 7, Tergrid 9; weighted by wins, 8.1. An average, not a
# median, and no spread: win_round_spread has no target. commanders.json's average_round_amount (8.4 for the four) is
# the length of every game played, won or not, so it is not used.

[win_round_median]
value = 8
lo = 7
hi = 9
n = 3697
source = "Playgroup commander stats, average win turn of Aurelia, Korvold, Marwyn, Tergrid, weighted by wins"
date = "2026-10-24"
note = "n = the four commanders' logged wins; Playgroup gives an average win turn, used as the median"

# --- How games are won: Playgroup commanders.json (https://playgroup.gg/api/public/v1/commanders.json), wins of the
# four commanders: combat and other damage 62.2%, combo, alternate win and mill 20.0%, commander damage 17.4%, poison
# 0.4% of 1,872 wins. Grouped as t6.toml groups them.

[win_damage]
