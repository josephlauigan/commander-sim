# Game formats. A deck without `format` in data/my_decks.toml plays `commander`. cardgen reads `bans` and `banned`
# (the per-deck legality check); `cardgen export` writes this file into data/decks.json ("formats"), where sim-core
# reads life, first_player_draws and seats and sim-cli refuses a deck at a table its format does not admit.
#
#   name                 what messages call the format
#   seats                2 or 4: the only table shapes the pod builders support
#   life                 every player's starting life total (at least 1)
#   first_player_draws   false: the starting player skips its first draw step (CR 103.8a)
#   bans                 "scryfall": Scryfall's `legalities.commander` decides (banned and not_legal are refused);
#                        "list": `banned` REPLACES that ban list (the card must still be a Commander-playable card:
#                        Scryfall `legal` or `banned`, never `not_legal` or `restricted`)
#   banned               the ban list, one front-face name per entry (names compared by front face, lower case)
#                        Only the FRONT face is matched, in both readers (cardgen and sim-core): a double-faced or flip card
#                        is listed by its front face ("Erayo, Soratami Ascendant"); an entry naming only a back face bans nothing.
#
#   [<key>.ai]           (optional) what the shared AI reads of the table (sim-core `TableAi`); a missing key keeps
#                        Commander's value; no other key is allowed (`duel`, one opponent, follows `seats == 2`)
#     learned_eval       true: the look-ahead scores generic decks with the learned evaluation (fitted on 4-seat,
#                        40-life games); false: today's hand-written evaluation
#     go_rules           "t6": a ready catalogue line waits for the table to be unable to stop it for Tier 6 seats
#                        only; "all": for every seat
#
# [commander] must keep exactly the values the engine has always played (40 life, first player draws, 4 seats); the
# loader refuses anything else (an [commander.ai] included), so editing this file cannot change every 4-player game.

[commander]
name = "Commander"
seats = 4
life = 40
first_player_draws = true
bans = "scryfall"

# Cali Commander: 1v1, 30 life. The ban list is copied from decklists/cali_commander/kyodai-artifact-combo.md
# ("Format and Rule 0"); JD confirmed these 18 names on 2026-11-23. The simulator's tooling made no web check
# against an official page. The guide also lists Mana Crypt, Tinker, Primeval Titan, Paradox Engine, Jeweled Lotus,
# Dockside Extortionist and Upheaval as legal in Cali. This list REPLACES Scryfall's banned list for a Cali deck.
[cali]
name = "Cali Commander"
seats = 2
life = 30
first_player_draws = false
bans = "list"
banned = [
  "Ancestral Recall",
  "Balance",
  "Black Lotus",
  "Channel",
  "Erayo, Soratami Ascendant",
  "Fastbond",
  "Karakas",
  "Mox Emerald",
  "Mox Jet",
  "Mox Pearl",
  "Mox Ruby",
  "Mox Sapphire",
  "Nadu, Winged Wisdom",
  "The Tabernacle at Pendrell Vale",
  "Time Vault",
  "Time Walk",
  "Tolarian Academy",
  "Yawgmoth's Bargain",
]

# The AI profile of a Cali table: the learned evaluation was fitted on 4-seat, 40-life games and a missing seat reads as
# zeros, so it is off; every seat plays Tier 6's hold-up-or-go gates. Duel cover (Silence covers one opponent) follows
# seats = 2.
[cali.ai]
learned_eval = false
go_rules = "all"
