# roles_gold.toml: hand-labelled gold set for the card-knowledge role classifier.
#
# Purpose: the PRECISION STANDARD that the rule-based role classifier (cardgen roles) and the local LLM stage are
#   measured against (documents/card-knowledge.md, "Role"; acceptance: gold micro-precision >= 0.90, micro-recall >= 0.85).
# Date: 2026-11-21 (round 2: Opus review applied, JD approved the revisions). Catalog: data/knowledge/oracle.json (bulk_updated_at 2026-11-21T10:01:56Z, 35,113 cards).
# Seed: 20261121 (Python random.Random). Sampling script: scratchpad gold/sample.py (deterministic; the seed lives here).
#
# Labels are hand-made from Oracle text; JD approves this file before it counts.
# No classifier, regex tagger, carddb tag or existing tagging code was used to decide any label (independence is the point).
#
# Sampling
#   source = "deck"   75 cards: the union of `cards` of every deck in data/decks.json `mine`, commander-legal, not a basic
#                     land and not a meld result, sorted by name, shuffled with the seed, lands capped at 15 (15 drawn).
#   source = "random" 75 cards: the same seed over every other commander-legal, non-basic, non-meld card in oracle.json
#                     (sorted by name, Group A excluded), lands capped at 15 (1 drawn).
#   source = "topup"  cards added by reading Oracle text so that every role has at least 5 (target 6) positive cards,
#                     preferring real tournament-relevant Commander cards, and covering several roles at once where
#                     the card really has them. Toxic Deluge, Cyclonic Rift, Esper Sentinel and Spark Double are in
#                     JD's decks but not in the seeded sample, so they are "topup", not "deck".
#   source = "decoy"  bait: looks like a role but is not. `not_roles` lists the roles it must NOT get. Many deck/random
#                     cards also carry a `not_roles` for a tempting wrong role; the classifier must avoid those too.
#
# Labelling rule (from the design): a card gets every role one of its abilities fulfils as a MAIN or REPEATABLE effect,
# at most 4, ordered by prominence; the first is `primary`. Incidental effects do not count. Lands get roles only
# beyond tapping for one mana. An MDFC's land face adds nothing. Zero roles is allowed: roles = [] and primary = "".
# Multi-face cards are judged as a whole card; a `prepare`-layout card gets the roles of its spell face (convention 21).
#
# Role definitions (design file, section 3, used as the standard):
#   ramp        adds mana beyond a land drop: rocks, dorks, land ramp, rituals, cost reducers
#   fixing      produces 2+ colours or any colour (lands included)
#   draw        net cards in hand: draw, impulse draw, wheels
#   selection   loot/rummage, scry or surveil 2+, card filtering with no net cards
#   tutor       searches the library for a nonland card (a land search is ramp/fixing)
#   removal     removes, steals or neutralises one opposing permanent (destroy, exile, bounce, -X/-X, fight, edict)
#   wipe        removes 2+ permanents at once (each/all, or a mass -X/-X)
#   counter     counters a spell or ability
#   protection  protects your permanents or yourself (hexproof, indestructible, phasing, Fog, Boots)
#   stax        taxes or restricts opponents, symmetrically or not (Rule of Law, Drannith, Esper Sentinel tax)
#   discard     makes opponents discard
#   gy-hate     exiles graveyards or stops graveyard use
#   recursion   returns cards from your graveyard to hand or library, or lets you cast them from there
#   reanimate   puts creatures from a graveyard onto the battlefield
#   self-mill   puts your own cards into your graveyard (mill, Entomb, discard outlets)
#   tokens      creates creature or treasure/clue tokens
#   anthem      pumps or grants keywords to your team
#   sac-outlet  sacrifices a permanent as a cost, repeatably
#   drain       opponents lose life from triggers (aristocrats, Y'shtola-style payoffs)
#   lifegain    gains life, or pays off life gained
#   counters    puts +1/+1 or other counters; proliferate
#   blink       exiles and returns your permanents
#   copy        copies spells, permanents or tokens (clones included)
#   extra-phase extra turns or extra combats
#   finisher    ends or wins the game when resolved or untouched: alt-win, mass pump-and-attack, infinite enabler, overwhelming bomb
#   evasion     makes your attackers unblockable or hard to block, or grants double strike
#
# Conventions applied to borderline calls. Each is a short self-contained clause that can be pasted into a role
# definition or the LLM prompt; the notes cite them by number. Reviewers should challenge any of them.
#  1. Keywords printed on a card that affect only that card give no evasion or protection role: flying, menace, shadow,
#     landwalk, trample, hexproof, ward, protection from, indestructible, and text such as "this creature can't be
#     blocked". Printed or static lifelink on a permanent, or a repeatable lifelink grant, is lifegain, listed last; a
#     one-turn lifelink from a spell or trigger is incidental and gives no role. Giving evasion (flying, menace, fear,
#     "can't be blocked", double strike) or protection (hexproof, shroud, indestructible, protection from) to other
#     creatures is evasion or protection. A team-wide grant or pump of evasion or combat keywords is also anthem,
#     applied evenly (Akroma's Will, Archetype of Imagination, Savage Beating); a team-wide grant of protection keywords
#     only (Heroic Intervention) is protection, not anthem; granting trample alone is not evasion.
#  2. A discard outlet is a repeatable ability whose only cost is discarding a card (Putrid Imp). Sacrificing or discarding
#     as part of the cost of the card's own effect gives no sac-outlet or self-mill role: self-sacrifice (Evolving Wilds,
#     Zack Fair, Mogg Fanatic), a one-time additional cost (Deadly Dispute, Bone Splinters), echo (Deepcavern Imp), a
#     one-shot hand dump (Lion's Eye Diamond), random discard (Gamble) and mana-plus-discard activations (Rakdos
#     Guildmage). Cards an effect puts into your graveyard by your choice (Entomb, Intuition, Scion of the Ur-Dragon) are
#     self-mill; a pile the opponent splits (Fact or Fiction) is not.
#  3. Draw means net card advantage. A spell's cantrip (Ponder, Smash, Startle, Relic of Progenitus) and a permanent that
#     sacrifices itself to draw one card (Maze Skullbomb, Scroll of Avacyn) replace themselves and are not draw; a
#     permanent that draws repeatedly or two or more cards (Investigator's Journal, Sinister Monolith, Bonders' Enclave)
#     is draw. Impulse draw and playing cards from the top of the library are draw (Fblthp, Urza).
#  4. Counters means a repeatable trigger or activation that puts +1/+1 or other counters on the card itself (K'rrik,
#     Pests of Honor, Katara), on another permanent (backup, Arbor Armament), or proliferate. A counter placed once on the
#     card itself by a keyword (renown, "enters with a +1/+1 counter") is not counters, and neither are bookkeeping
#     counters (ki, suspect, void, finality, time).
#  5. A land search that can reach lands of two or more colours (two basic types, any basic, any land) is fixing (Arid
#     Mesa, Evolving Wilds, Urza's Cave, Ash Barrens' basic landcycling, Natural Connection); a search for ONE basic type
#     (Mountaincycling, "basic Plains card") is not fixing. A search that puts the land onto the battlefield from a spell
#     or an enter trigger, beyond your land drop, is also ramp; a fetch that only replaces itself is not ramp.
#  6. Narrow or conditional versions of an effect still count when the effect is the card's main ability (Loyal
#     Warhound's conditional land ramp, Delighted Halfling's restricted mana, Mox Jasper's Dragon condition).
#  7. Cost reducers are ramp, even narrow ones (Danitha, Bladegraft Aspirant, Melek, Tam) and a life payment in place
#     of mana (K'rrik); a cost reduction for the card itself only (The Pride of Hull Clade) is not ramp.
#  8. Drain is repeatable opponent life loss (a trigger or an activation) or a spell that makes EACH opponent lose life
#     (Exsanguinate); one-shot burn or damage to one player on a spell (Blightning, Refuse) is not drain. Damage or -X/-X
#     that can hit a creature or any target is removal and not also drain (Lightning Bolt, Triskelion, Dragon Tempest).
#     A targeted multi-permanent destroy (Decimate) is removal, not wipe; a 1-damage enter trigger (Thundermaw Hellkite)
#     and combat-only damage (Ashmouth Hound) are neither wipe nor removal.
#  9. A temporary steal (Metallic Mastery, "until end of turn") is not removal.
# 10. An attack tax (Propaganda, Baird) is stax, not protection.
# 11. A bare "tap target creature" (Flanking Troops, Pressure Point) gets no role.
# 12. Manifest puts a card face down; it is not a token, so no tokens role (Ugin's Mastery).
# 13. A card's alternate-mode ability counts when it is a real function of the card even though it is not repeatable:
#     channel (Otawara), landcycling (Ash Barrens), flashback, and the spell face of an MDFC (Agadeem's Awakening). A
#     planeswalker ultimate (a minus ability costing more than the starting loyalty) gives no role.
# 14. Creature, Treasure and Clue tokens count as tokens (Deadly Dispute's Treasure, Undercity Dire Rat).
# 15. Scry or surveil 2+ and dig effects that find a card without netting cards (Bond of Flourishing) are selection;
#     scry 1 (Viscera Seer, Skywhaler's Shot) is not.
# 16. Life: "gain/lose N life" is a role only when it is the effect's purpose (Exsanguinate, Approach of the Second Sun,
#     Sinister Monolith's trigger) or a trigger that pays off life (Marauding Blight-Priest). A small rider on a spell
#     whose main effect is something else is not (Sephiroth's Intervention, Bond of Flourishing). Life paid or lost by
#     the caster (Reanimate, Thoughtseize, Phyrexian Arena) is neither drain nor lifegain.
# 17. "Can't be countered" is neither counter nor protection (Mistrise Village, Delighted Halfling, Shifting Ceratops),
#     and ward reminder text ("counter it unless that player pays") is not counter (Tomakul Honor Guard).
# 18. A static, permanent mass -1/-1 (Curse of Death's Hold) counts as wipe.
# 19. Mana from sacrificing (Ashnod's Altar, Phyrexian Altar) is ramp AND sac-outlet, ramp listed first; Phyrexian
#     Altar also fixing (any colour).
# 20. Roles never come from commander-deck context or combo knowledge that is not in the Oracle text (Doomsday is a
#     tutor, not a finisher; Exquisite Blood is lifegain, not drain or finisher).
# 21. A card with the prepare layout gets the roles of its spell face, because the card makes itself prepared and the
#     spell is its repeatable function (Emeritus of Conflict // Lightning Bolt is removal); the reminder "you may cast a
#     copy of its spell" is never copy.


