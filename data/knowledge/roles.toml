# Role taxonomy v1. The LLM prompt is built from `shared`, each role's `definition` and `clauses`, and the cross-role `clause`s;
# nothing in a definition names a card (the model has no internet). Guards apply to the cited Oracle line.
# `keep_rule = true` keeps a rule-found, non-certain role of that kind on a routed card the LLM omitted (default false).
version = 1
shared = """Label a card with a role only for a MAIN or REPEATABLE effect: what the card is for. An incidental rider, a cost, a drawback or a keyword that affects only the card itself gives no role, and zero roles is allowed. Give at most four roles, most prominent first. Judge the Oracle text alone, never combo, commander or deck context. A land gets roles only beyond tapping for one mana. The land back of an MDFC adds nothing. A prepare card gets the roles of its spell face and of its creature face's own abilities. A planeswalker ability costing at least the starting loyalty (an ultimate) gives no role."""

[[clause]]
id = "C1"
roles = ["protection", "anthem", "lifegain"]
text = "Granting ward to other permanents is protection. A team-wide lifelink-only grant is lifegain, not anthem; anthem needs a stat pump or an evasion/combat keyword grant."

[[clause]]
id = "C2"
roles = ["tokens", "draw"]
text = "Food, Blood, Map, Junk and other non-Treasure, non-Clue artifact tokens are not `tokens`: judge their ability on its own. A repeatable Clue maker is tokens AND draw; one Clue from a spell or an enter trigger is tokens only."

[[clause]]
id = "C3"
roles = ["anthem", "counters", "tokens"]
text = "A +1/+1 counter on each creature you control is counters and anthem. Counters on players (poison, energy, experience, rad) are not `counters`; proliferate is. Amass is tokens, and also counters when repeatable."

[[clause]]
id = "C4"
roles = ["recursion", "reanimate"]
text = "A card that can return a creature or a noncreature permanent card from your graveyard is both recursion and reanimate; `reanimate` is only for creature cards put onto the battlefield, `recursion` for returns to hand or library, noncreature permanents onto the battlefield, and permission to cast from the graveyard."

[[clause]]
id = "C5"
roles = ["copy", "tokens"]
text = "A token copy of a creature is copy AND tokens, copy first."

[[clause]]
id = "C6"
roles = ["ramp", "tokens"]
text = "A repeatable or multi-Treasure maker is tokens AND ramp; a single Treasure rider on another effect is tokens only."

[[clause]]
id = "C7"
roles = ["ramp", "fixing"]
text = "A mana filter (an activation whose mana cost equals the mana it adds, e.g. '{1}, {T}: Add one mana of any color') is `fixing`, not `ramp`: ramp needs net mana beyond a land drop."

[[clause]]
id = "C12"
roles = ["removal", "tokens"]
text = "Tokens given to an opponent as compensation for losing a permanent are not `tokens`; the edict or destroy part is still `removal`."

[[clause]]
id = "C14"
roles = ["wipe", "removal"]
text = "Damage to EACH creature, or each creature of one group (fliers only, attackers only, tapped creatures), is `wipe` even for 1 damage: it sweeps the group. A single targeted damage effect is `removal`."

[[clause]]
id = "C15"
roles = ["draw"]
text = "A self-sacrifice cantrip ('Sacrifice this: draw a card') and an aura or equipment cantrip ('when enchanted creature dies, draw a card', 'when this Aura enters, draw a card') replace themselves and are NOT `draw`; a multi-use permanent or one that draws 2+ cards still is."

[[clause]]
id = "C16"
roles = ["ramp", "fixing"]
text = "A permanent that adds one mana of a chosen colour is `ramp`, not `fixing`: it produces one colour. `fixing` needs two or more colours or any colour (filters included)."

[[clause]]
id = "C17"
roles = ["selection", "draw"]
text = "'Exile any number of cards from your hand face down, then draw that many cards' (or put that many from the top of your library into your hand) is `selection`, a hand filter that nets no cards, not `draw`."

[[clause]]
id = "C18"
roles = ["fixing", "ramp", "tokens"]
text = "A Treasure maker is never `fixing` (it stays `tokens` and, when repeatable or multi, `ramp`); the any-colour mana of its Treasure tokens does not count for the maker itself."

[[role]]
id = "ramp"
definition = "adds mana beyond a land drop: rocks, dorks, land ramp, rituals, cost reducers."
clauses = [
  "Land searches that put a land onto the battlefield from a spell or an enter trigger are ramp; a self-replacing fetch is not.",
  "Narrow cost reducers and life paid instead of mana count; a cost reduction for the card itself only does not.",
  "Mana from sacrificing is ramp and sac-outlet, ramp first.",
  "Narrow or conditional main effects count.",
]
src = "rules"
guard = """\
(?i)add|less to (?:cast|activate)|cost.*less|pay .*life rather than|search .*library|additional land|\
untap.*lands?|land creature token|affinity|return.*land cards?.*battlefield|treasure"""

[[role]]
id = "fixing"
definition = "produces 2+ colours or any colour (lands included)."
clauses = [
  "Land searches reaching two or more basic types, any basic land or any land count; a search for one basic type does not.",
  "Narrow or conditional main effects count.",
]
src = "rules"
guard = '(?i)add|mana of any|search .*library|landcycling|enchanted land is'

[[role]]
id = "draw"
definition = "net cards in hand: draw, impulse draw, wheels."
clauses = [
  "A spell's cantrip and a permanent sacrificing itself to draw one card replace themselves and are not draw.",
  "Repeated draw or drawing two or more cards is draw; impulse draw and playing cards from the top of the library are draw.",
  "The monarch draws a card every end step: becoming the monarch repeatably is draw.",
]
src = "rules"
guard = """\
(?i)draw|monarch|(?:play|cast|plot).*?(?:library|exiled)|(?:put|return).*?hand|cascade|investigate|clue token|\
junk token|may (?:play|cast) (?:it|that card|those cards|one of those cards)"""

[[role]]
id = "selection"
definition = "loot/rummage, scry or surveil 2+, card filtering with no net cards."
clauses = [
  "Scry or surveil 2+ and digging that finds a card without netting cards count; scry 1 does not.",
  "Looting or rummaging filters without net cards.",
]
src = "rules"
guard = '(?i)scry|surveil|draw.*discard|discard.*draw|look at|reveal.*top|from among.*hand|connive|recruit|learn|blood token'

[[role]]
id = "tutor"
definition = "searches the library for a nonland card (a land search is ramp/fixing)."
clauses = [
  "The search must be able to reach nonland cards; a land-only search is ramp/fixing.",
  "Roles never come from combo or commander context: a tutor is not a finisher for finding a combo.",
  "'Search your library for a card named ~' (a copy of itself) is not `tutor`.",
]
src = "rules"
guard = '(?i)search .*library|transmute'

[[role]]
id = "removal"
definition = "removes, steals or neutralises one opposing permanent (destroy, exile, bounce, -X/-X, fight, edict)."
clauses = [
  "Targeted multi-permanent destruction is removal, not wipe.",
  "Temporary stealing, bare tapping, combat-only damage and a 1-damage enter trigger do not count; a permanent steal does.",
  "Damage that can hit creatures is removal, not also drain.",
  "Exile and return of your own permanents is blink.",
]
src = "rules+llm"
guard = """\
(?i)destroy|exile|return|damage|-[0-9x]+/-|fight|sacrifice|control of|control enchanted (?:creature|\
permanent)|annihilator|put (?:up to [a-z]+ )?target.*library|shuffles.*library|at the beginning.*tap|enchanted.*(?:tap|untap|\
attack|loses)|it gets -|target permanent.*untap|tap.*target.*(?:creature|permanent|land|artifact|enchantment)"""

[[role]]
id = "wipe"
definition = "removes 2+ permanents at once (each/all, or a mass -X/-X)."
clauses = [
  "Each/all destruction, exile, bounce or mass negative toughness counts; a static permanent mass -1/-1 counts.",
  "Targeted multi-permanent destruction does not count (that is removal).",
]
src = "rules"
guard = '(?i)\b(?:all|each)\b|overload|destroy the rest|creatures.*get -[0-9x]+/-[0-9x]+'

[[role]]
id = "counter"
definition = "counters a spell or ability."
clauses = [
  "'Can't be countered' is neither counter nor protection.",
  "Ward reminder text ('counter it unless that player pays') is never counter.",
  "Counters placed on permanents are not counter.",
]
src = "rules"
guard = '(?i)counter|exile.*spells?'

[[role]]
id = "protection"
definition = "protects your permanents or yourself (hexproof, shroud, indestructible, protection from, phasing, a Fog that prevents all combat damage, equipment granting hexproof)."
clauses = [
  "Printed keywords affecting only their own card give no protection.",
  "Giving hexproof, shroud, indestructible or protection to other creatures counts.",
  "Protection-only team grants are protection, not anthem.",
  "Attack taxes are stax. 'Can't be countered' is not protection.",
]
src = "rules+llm"
guard = '(?i)hexproof|shroud|indestructible|protection|phase|prevent.*damage|regenerate|ward|umbra armor'

[[role]]
id = "stax"
definition = "taxes or restricts opponents, symmetrically or not (a cap on spells per turn, a ban on casting or activating, a tax on an opponent's spells)."
clauses = [
  "Attack taxes and restrictions on players count.",
  "Printed self keywords and bare tapping do not count.",
]
src = "llm"
guard = """\
(?i)can't|cannot|cost|unless.*pay|only.*(?:spell|turn)|loses all abilities|enter tapped|don't untap|\
lands are Mountains|shuffle their library|instead.*sacrifices.*land"""

[[role]]
id = "discard"
definition = "makes opponents discard."
clauses = [
  "Only opposing discards count.",
  "Self costs, echo, one-shot hand dumps, random self-discard and mana-plus-discard activations do not count.",
]
src = "rules"
guard = '(?i)discard'

[[role]]
id = "gy-hate"
definition = "exiles graveyards or stops graveyard use."
clauses = [
  "Exiling graveyards or preventing graveyard use counts.",
  "Exiling your own card to pay a cost is not graveyard hate.",
]
src = "rules"
guard = '(?i)graveyard'

[[role]]
id = "recursion"
definition = "returns cards from your graveyard to hand or library, puts noncreature permanent cards from your graveyard onto the battlefield, or lets you cast or play them from there."
clauses = [
  "Permission to cast other cards from your graveyard counts.",
  "A card's own flashback is an alternate mode, not a recursion role by itself.",
]
src = "rules"
guard = '(?i)graveyard|flashback|soulshift'

[[role]]
id = "reanimate"
definition = "puts creatures from a graveyard onto the battlefield."
clauses = [
  "Alternate spell faces and conditional main effects count.",
]
src = "rules"
guard = '(?i)graveyard|creature.*dies.*return|creature card.*battlefield|opponent sacrifices a nontoken permanent'

[[role]]
id = "self-mill"
definition = "puts your own cards into your graveyard (mill, tutors that put a chosen card into the graveyard, discard outlets)."
clauses = [
  "A free repeatable discard outlet (the only cost is discarding a card) counts.",
  "Self-sacrifice, additional costs, echo, one-shot hand dumps, random discard and mana-plus-discard activations do not.",
  "Cards you choose to put into your graveyard (search then put it there, pick which looked-at cards) count; a pile an opponent splits does not.",
]
src = "rules"
guard = '(?i)mill|discard|graveyard'

[[role]]
id = "tokens"
definition = "creates creature or treasure/clue tokens."
clauses = [
  "Creature, Treasure and Clue tokens count.",
  "Manifest makes a face-down card, not a token.",
  "Tokens made for an opponent as compensation do not describe your deck-building function.",
]
src = "rules"
guard = '(?i)token|investigate|amass|populate|incubate|mobilize|afterlife|recruit'

[[role]]
id = "anthem"
definition = "pumps or grants keywords to your team."
clauses = [
  "Team pumps and team grants of evasion or combat keywords count; team protection-only grants do not.",
  "Self buffs and single-target pumps are not anthem.",
  "A team-wide haste grant alone is not anthem: it needs a stat pump or an evasion/combat-damage keyword (flying, double strike, trample, menace, 'can't be blocked') for your whole team.",
  "A pump or grant on 'up to N target creatures' (not your whole team) is not anthem.",
]
src = "rules"
guard = '(?i)(?:creatures?|[a-z]+s).*?(?:gets?|gains?|have|has)|\+1/\+1 counter|(?:each )?other .*gets?'

[[role]]
id = "sac-outlet"
definition = "sacrifices a permanent as a cost, repeatably."
clauses = [
  "The sacrifice must be a repeatable cost accepting other permanents.",
  "Self-sacrifice, additional casting costs, echo and one-shot hand dumps do not count.",
  "Sacrifice for mana also counts as ramp, ramp first.",
]
src = "rules"
guard = '(?i)sacrifice.*:'

[[role]]
id = "drain"
definition = "opponents lose life from triggers (aristocrat-style payoffs: whenever a creature dies, each opponent loses life)."
clauses = [
  "Repeatable opposing life loss, or a spell making each opponent lose life, counts.",
  "One-shot single-player burn and life paid or lost by the caster do not count.",
  "Damage able to hit a creature or any target is removal, not also drain.",
]
src = "rules+llm"
guard = '(?i)loses? .*life|damage'

[[role]]
id = "lifegain"
definition = "gains life, or pays off life gained."
clauses = [
  "Life gain or a payoff for gaining life must be the card's purpose or a repeatable trigger; a small rider on another spell effect does not count, and neither does life paid or lost by the caster.",
  "Printed or static lifelink on permanents and repeatable activated lifelink grants count, listed last; one-turn lifelink from a spell or trigger is incidental.",
]
src = "rules"
guard = '(?i)gain.*life|lifelink|food token|double.*life total'

[[role]]
id = "counters"
definition = "puts +1/+1 or other counters; proliferate."
clauses = [
  "Repeatable self-counter triggers, counters placed on other permanents and proliferate count.",
  "One-time self enters-with or renown counters and bookkeeping counters (ki, suspect, void, finality, time) do not.",
]
src = "rules"
guard = """\
(?i)counter|proliferate|backup|bolster|support|adapt|awaken|connive|dethrone|mentor|evolve|training|amass|\
map token"""

[[role]]
id = "blink"
definition = "exiles and returns your permanents."
clauses = [
  "Ordinary graveyard returns are recursion or reanimate, not blink.",
]
src = "rules"
guard = '(?i)exile.*(?:return|put both cards onto the battlefield)'

[[role]]
id = "copy"
definition = "copies spells, permanents or tokens (clones included)."
clauses = [
  "Spell, permanent and token copies count.",
  "A prepare reminder saying you may cast a copy of its spell never counts.",
]
src = "rules+llm"
guard = '(?i)cop(?:y|ies)|casualty|conspire|replicate|storm'

[[role]]
id = "extra-phase"
definition = "extra turns or extra combats."
clauses = [
  "Extra turns and additional combats count.",
]
src = "rules"
guard = '(?i)extra (?:turn|combat)|additional (?:combat|turn|beginning phase)'

[[role]]
id = "finisher"
definition = "ends or wins the game when resolved or untouched: alt-win, mass pump-and-attack, infinite enabler, overwhelming bomb."
clauses = [
  "Use only what is in the Oracle text: no commander-deck or combo context.",
  "A tutor for a combo, or one half of an unstated combo, is not a finisher.",
]
src = "llm"
guard = '(?i)win the game|loses the game|infect|double|damage|\+[x0-9]+/\+[x0-9]+|untap|mana|combat'

[[role]]
id = "evasion"
definition = "makes your attackers unblockable or hard to block, or grants double strike."
clauses = [
  "Printed self flying, menace, shadow, landwalk, trample and 'can't be blocked' give no role; trample alone is not evasion.",
  "Grants to other creatures of flying, menace, fear, 'can't be blocked' or double strike count; team grants are also anthem.",
]
src = "rules+llm"
guard = '''(?i)flying|menace|fear|shadow|horsemanship|can't be blocked|double strike|intimidate'''
