# Role taxonomy v1. The LLM prompt is built from `shared`, each role's `definition` and `clauses`, and the cross-role `clause`s;
# nothing in a definition names a card (the model has no internet). Guards apply to the cited Oracle line.
# FROZEN CONFIGURATION (2026-11-22, from the pilot data). Add-only merge: `keep_rule = true` for ALL 26 roles, so the LLM
# never removes a rule role (a rule-found, non-certain role is kept on a routed card the LLM omitted); the LLM may only
# ADD roles, and not for the 8 roles whose LLM-alone score was too weak: `llm_add = false` for ramp, fixing, draw,
# selection, sac-outlet, finisher, evasion, blink. Why: vetoes hurt. LLM alone on the routed gold cards scored
# P 0.92 / R 0.78-0.80 for the roles left on, but on the blind set merged versus rules only was 26 versus 27 errors
# (+4 true, +3 false, -4 missed), so letting the LLM veto roles does not pay. This supersedes JD's 16/10 keep split of
# 2026-11-21 (per-role keep_rule = false is still supported by the merge, just not set).
version = 1
shared = """Label a card with a role only for a MAIN or REPEATABLE effect: what the card is for. An incidental rider, a cost, a drawback or a keyword that affects only the card itself gives no role, with three exceptions: any Creature, Treasure or Clue token the card makes is `tokens` even as a rider; printed lifelink is `lifegain`, listed last; and an alternate mode that is a real function of the card counts although it is used once (channel, landcycling, the spell face of a two-faced card). Zero roles is allowed. Give at most four roles, most prominent first. Judge the Oracle text alone, never combo, commander or deck context. A land gets roles only beyond tapping for one mana. A card whose type line reads 'A // B' is judged as one card; the land back of a modal double-faced card has been removed. A creature that 'becomes prepared' or 'enters prepared' can cast a copy of its second face's spell: give it the roles of that spell and of its own abilities. Planeswalker ultimates have been removed."""

[[clause]]
id = "C1"
roles = ["protection", "anthem", "lifegain"]
text = "Granting ward to other permanents is protection. A team-wide lifelink-only grant is lifegain, not anthem; anthem needs a stat pump or an evasion/combat keyword grant."

[[clause]]
id = "C2"
roles = ["tokens", "draw"]
text = "Food, Blood, Map, Junk and other non-Treasure, non-Clue artifact tokens are not `tokens`: judge their ability on its own. A repeatable Clue maker is tokens AND draw; one Clue from a spell or an enter trigger is tokens only."

[[clause]]
id = "C3"
roles = ["anthem", "counters", "tokens"]
text = "A +1/+1 counter on each creature you control is counters and anthem. Counters on players (poison, energy, experience, rad) are not `counters`; proliferate is. Amass is tokens, and also counters when repeatable."

[[clause]]
id = "C4"
roles = ["recursion", "reanimate"]
text = "A card that can return a creature or a noncreature permanent card from your graveyard is both recursion and reanimate; `reanimate` is only for creature cards put onto the battlefield, `recursion` for returns to hand or library, noncreature permanents onto the battlefield, and permission to cast from the graveyard."

[[clause]]
id = "C5"
roles = ["copy", "tokens"]
text = "A token copy of a creature is copy AND tokens, copy first."

[[clause]]
id = "C6"
roles = ["ramp", "tokens"]
text = "A repeatable or multi-Treasure maker is tokens AND ramp; a single Treasure rider on another effect is tokens only."

[[clause]]
id = "C7"
roles = ["ramp", "fixing"]
text = "A mana filter (an activation whose mana cost equals the mana it adds, e.g. '{1}, {T}: Add one mana of any color') is `fixing`, not `ramp`: ramp needs net mana beyond a land drop."

[[clause]]
id = "C12"
roles = ["removal", "tokens"]
text = "Tokens given to an opponent as compensation for losing a permanent are not `tokens`; the edict or destroy part is still `removal`."

[[clause]]
id = "C14"
roles = ["wipe", "removal"]
text = "Damage to EACH creature, or each creature of one group (fliers only, attackers only, tapped creatures), is `wipe` even for 1 damage: it sweeps the group. A single targeted damage effect is `removal`."

[[clause]]
id = "C15"
roles = ["draw"]
text = "A self-sacrifice cantrip ('Sacrifice this: draw a card') and an aura or equipment cantrip ('when enchanted creature dies, draw a card', 'when this Aura enters, draw a card') replace themselves and are NOT `draw`; a multi-use permanent or one that draws 2+ cards still is."

[[clause]]
id = "C16"
roles = ["ramp", "fixing"]
text = "A permanent that adds one mana of a chosen colour is `ramp`, not `fixing`: it produces one colour. `fixing` needs two or more colours or any colour (filters included)."

[[clause]]
id = "C17"
roles = ["selection", "draw"]
text = "'Exile any number of cards from your hand face down, then draw that many cards' (or put that many from the top of your library into your hand) is `selection`, a hand filter that nets no cards, not `draw`."

[[clause]]
id = "C18"
roles = ["fixing", "ramp", "tokens"]
text = "A Treasure maker is never `fixing` (it stays `tokens` and, when repeatable or multi, `ramp`); the any-colour mana of its Treasure tokens does not count for the maker itself."

[[role]]
id = "ramp"
definition = "adds mana beyond a land drop: mana rocks and dorks, rituals, cost reducers (even narrow ones, or life paid instead of mana), spells or enter triggers that put a land onto the battlefield, a repeatable maker of Treasure or several Treasures at once."
clauses = [
  "Mana from sacrificing is ramp and sac-outlet, ramp first.",
  "Narrow or conditional main effects count.",
  "A nonland permanent that adds one mana of a chosen colour is ramp.",
]
no = "a land that only taps for one mana (any single mana, even of any colour); a land that sacrifices itself to fetch a land (that is `fixing`, not ramp); a mana filter (`fixing`); a cost reduction for the card itself only; one Treasure as a rider on another effect (only `tokens`)."
src = "rules"
guard = """\
(?i)add|less to (?:cast|activate)|cost.*less|pay .*life rather than|search .*library|additional land|\
untap.*lands?|land creature token|affinity|return.*land cards?.*battlefield|treasure"""
keep_rule = true
llm_add = false

[[role]]
id = "fixing"
definition = "produces two or more colours or any colour: any-colour rocks and lands, mana filters, lands or spells that search for two or more basic land types, any basic land or any land, basic landcycling."
clauses = [
  "A land that sacrifices itself to search for a land that can be of two or more colours (a fetchland) is fixing.",
  "Narrow or conditional main effects count.",
]
no = "a source of ONE colour; one mana of a chosen colour (`ramp`); a search for ONE basic land type; a Treasure maker (its Treasure's any-colour mana is not the card's own)."
src = "rules"
guard = '(?i)add|mana of any|search .*library|landcycling|enchanted land is'
keep_rule = true
llm_add = false

[[role]]
id = "draw"
definition = "nets cards: draws two or more cards, draws repeatedly (a trigger or an activation), draws a card for each of something, impulse draws and plays cards from the top of the library, wheels, becomes the monarch repeatably."
clauses = [
  "The monarch draws a card every end step: becoming the monarch repeatably is draw.",
]
no = "drawing ONE fixed card once: a spell's cantrip, 'when this enters or dies, draw a card', a self-sacrifice or aura/equipment cantrip, cycling and any ability that draws one card in place of the card itself; scry, surveil or looking at the top card; a loot or rummage (`selection`); 'if you would draw' replacement conditions."
src = "rules"
guard = """\
(?i)draw|monarch|(?:play|cast|plot).*?(?:library|exiled)|(?:put|return).*?hand|cascade|investigate|clue token|\
junk token|may (?:play|cast) (?:it|that card|those cards|one of those cards)"""
keep_rule = true
llm_add = false

[[role]]
id = "selection"
definition = "filters cards without netting any: loot or rummage (draw then discard), scry or surveil 2 or more, digging for a card among the top cards, a hand filter (exile any number of cards from your hand, get that many back)."
clauses = [
  "Looting or rummaging filters without net cards.",
]
no = "scry 1 or surveil 1; looking at the top card without moving it; an effect that draws more than it discards (`draw`); fetching a card from the library (`tutor`)."
src = "rules"
guard = '(?i)scry|surveil|draw.*discard|discard.*draw|look at|reveal.*top|from among.*hand|connive|recruit|learn|blood token'
keep_rule = true
llm_add = false

[[role]]
id = "tutor"
definition = "searches the library for a card that can be nonland (any card, a creature, an artifact...) and puts it into your hand, onto the battlefield, onto the library or into the graveyard; transmute."
clauses = [
  "A search that puts the chosen card into your graveyard is a tutor AND `self-mill`.",
  "Roles never come from combo or commander context: a tutor is not a finisher for finding a combo.",
]
no = "a search for a land only (`ramp` or `fixing`); a search for a card named ~ (a copy of itself); looking at the top cards without searching (`selection`)."
src = "rules"
guard = '(?i)search .*library|transmute'
keep_rule = true

[[role]]
id = "removal"
definition = "removes, steals or neutralises ONE opposing permanent for good: destroy, exile, bounce, -X/-X, fight, an edict, a permanent steal (gain control of it), damage that can hit a creature, repeatable pinging (even 1 damage)."
clauses = [
  "Targeted multi-permanent destruction ('destroy target artifact, target creature, ...') is removal, not wipe.",
  "Damage that can hit creatures is removal, not also drain.",
]
no = "bare tapping; a temporary steal ('until end of turn'); combat-only damage; a 1-damage enter trigger; exile and return of your own permanents (`blink`); sacrificing your own permanent as a cost."
src = "rules+llm"
guard = """\
(?i)destroy|exile|return|damage|-[0-9x]+/-|fight|sacrifice|control of|control enchanted (?:creature|\
permanent)|annihilator|put (?:up to [a-z]+ )?target.*library|shuffles.*library|at the beginning.*tap|enchanted.*(?:tap|untap|\
attack|loses)|it gets -|target permanent.*untap|tap.*target.*(?:creature|permanent|land|artifact|enchantment)"""
keep_rule = true

[[role]]
id = "wipe"
definition = "removes or damages every creature or permanent at once: destroy, exile or bounce all or each, a mass -X/-X, a static mass -1/-1, damage to each creature or to each creature of one group (fliers, attackers) even for 1 damage."
clauses = []
no = "targeted multi-permanent destruction ('target X, target Y': that is `removal`); damage only to players; a 1-damage enter trigger at one target."
src = "rules"
guard = '(?i)\b(?:all|each)\b|overload|destroy the rest|creatures.*get -[0-9x]+/-[0-9x]+'
keep_rule = true

[[role]]
id = "counter"
definition = "counters a spell or an ability on the stack."
clauses = []
no = "'can't be countered' (neither counter nor protection); ward and its reminder text; putting counters on permanents (`counters`); preventing the damage of a spell (`protection`)."
src = "rules"
guard = '(?i)counter|exile.*spells?'
keep_rule = true

[[role]]
id = "protection"
definition = "protects your permanents or you: gives hexproof, shroud, indestructible, protection from or ward to OTHER permanents (a team grant of only protection keywords is protection, not anthem), phasing out, a Fog (prevent all combat damage), prevents the damage dealt by a source, equipment that grants hexproof."
clauses = []
no = "keywords printed on the card that affect only itself (hexproof, ward, indestructible, protection from, flying...); 'can't be countered'; an attack tax (`stax`); tapping a creature."
src = "rules+llm"
guard = '(?i)hexproof|shroud|indestructible|protection|phase|prevent.*damage|regenerate|ward|umbra armor'
keep_rule = true

[[role]]
id = "stax"
definition = "taxes or restricts opponents, symmetrically or not: extra costs for their spells, attacks or abilities, 'can't cast, attack, draw or search' effects, a cap on spells per turn, lands or creatures that enter tapped or don't untap, 'draw a card unless they pay'."
clauses = [
  "Attack taxes and restrictions on players count.",
  "A tax whose payoff is a card for you ('draw a card unless that player pays') is stax AND draw.",
]
no = "keywords printed on the card; bare tapping; a restriction on the card itself ('this creature can't block'); making one creature unable to be blocked (`evasion`)."
src = "llm"
guard = """\
(?i)can't|cannot|cost|unless.*pay|only.*(?:spell|turn)|loses all abilities|enter tapped|don't untap|\
lands are Mountains|shuffle their library|instead.*sacrifices.*land"""
keep_rule = true

[[role]]
id = "discard"
definition = "makes opponents discard: each opponent or a target opponent discards, reveal-and-discard."
clauses = []
no = "your own discard as a cost, echo or a loot; a one-shot hand dump; random self-discard; a mana-plus-discard activation."
src = "rules"
guard = '(?i)discard'
keep_rule = true

[[role]]
id = "gy-hate"
definition = "exiles graveyards or stops graveyard use: exile all or target graveyards, exile cards from graveyards, 'if a card would go to a graveyard, exile it instead', 'can't cast from graveyards'."
clauses = [
  "A mode that exiles all graveyards is gy-hate even on a wrath.",
]
no = "exiling your own card to pay a cost (an additional cost, escape); your own flashback exiling the card; putting cards into a graveyard."
src = "rules"
guard = '(?i)graveyard'
keep_rule = true

[[role]]
id = "recursion"
definition = "returns cards from your graveyard to your hand or library, puts noncreature permanent cards from your graveyard onto the battlefield, or lets you cast or play cards from your graveyard."
clauses = [
  "Permission to cast other cards from your graveyard counts.",
  "A card that can return a creature OR a noncreature permanent card ('permanent card') is both recursion and `reanimate`.",
]
no = "a card's own flashback, escape or unearth; returning creature cards only to the battlefield (`reanimate` only); returning a card from exile (`blink`); putting cards into the graveyard."
src = "rules"
guard = '(?i)graveyard|flashback|soulshift'
keep_rule = true

[[role]]
id = "reanimate"
definition = "puts creature cards from a graveyard onto the battlefield (yours or an opponent's)."
clauses = [
  "Alternate spell faces and conditional main effects count.",
]
no = "putting a noncreature permanent card onto the battlefield (`recursion` only); returning cards to a hand (`recursion`)."
src = "rules"
guard = '(?i)graveyard|creature.*dies.*return|creature card.*battlefield|opponent sacrifices a nontoken permanent'
keep_rule = true

[[role]]
id = "self-mill"
definition = "puts your own cards into your graveyard: mill yourself, a search or a choice that puts a chosen card into the graveyard, a free repeatable discard outlet (the only cost is discarding a card)."
clauses = [
  "Cards you choose to put into your graveyard (search then put it there, pick which looked-at cards) count.",
]
no = "discarding or sacrificing as the cost of the card's own effect; echo; a one-shot hand dump; random discard; a mana-plus-discard activation; a pile an opponent splits; milling an opponent."
src = "rules"
guard = '(?i)mill|discard|graveyard'
keep_rule = true

[[role]]
id = "tokens"
definition = "creates creature, Treasure or Clue tokens, even as a rider on another effect: investigate, amass, populate, a token copy of a creature."
clauses = [
  "Creature, Treasure and Clue tokens count.",
]
no = "Food, Blood, Map, Junk and other artifact tokens; manifest (a face-down card, not a token); tokens made for an opponent as compensation."
src = "rules"
guard = '(?i)token|investigate|amass|populate|incubate|mobilize|afterlife|recruit'
keep_rule = true

[[role]]
id = "anthem"
definition = "buffs or gives keywords to your WHOLE team: a team pump, a team grant of flying, double strike, trample, menace, 'can't be blocked' or another combat keyword, a +1/+1 counter on each creature you control."
clauses = [
  "Team pumps and team grants of evasion or combat keywords count; team protection-only grants do not.",
]
no = "a pump or grant on this creature only, on one target or on 'up to N target creatures'; a team grant of only protection keywords (`protection`), only lifelink (`lifegain`) or only haste; doubling damage; moving Auras or Equipment."
src = "rules"
guard = '(?i)(?:creatures?|[a-z]+s).*?(?:gets?|gains?|have|has)|\+1/\+1 counter|(?:each )?other .*gets?'
keep_rule = true

[[role]]
id = "sac-outlet"
definition = "sacrifices other permanents as a repeatable cost of an ability ('Sacrifice a creature: ...')."
clauses = [
  "Sacrifice for mana also counts as ramp, ramp first.",
]
no = "sacrificing the card itself ('Sacrifice this: ...', 'when this attacks, sacrifice it'); an additional cost to cast a spell; echo or an upkeep sacrifice; sacrificing a Treasure, Clue or Food token."
src = "rules"
guard = '(?i)sacrifice.*:'
keep_rule = true
llm_add = false

[[role]]
id = "drain"
definition = "makes opponents lose life as the effect: each opponent loses life (a spell, a repeatable trigger or activation), aristocrat-style payoffs, repeatable damage to opponents."
clauses = [
  "Repeatable opposing life loss, or a spell making each opponent lose life, counts.",
]
no = "one-shot burn or damage to one player on a spell; damage that can hit a creature or any target (`removal`); life you pay or lose yourself; combat-damage triggers."
src = "rules+llm"
guard = '(?i)loses? .*life|damage'
keep_rule = true

[[role]]
id = "lifegain"
definition = "gains life as the card's purpose or on a repeatable trigger, pays off life gained ('whenever you gain life'), or has printed or static lifelink (listed last) or a repeatable lifelink grant."
clauses = [
  "A spell whose point includes the gain ('gain X life', 'gain life equal to the life lost') counts.",
]
no = "a small life gain tacked onto a removal or other spell; life you pay or lose; one-turn lifelink from a spell or trigger."
src = "rules"
guard = '(?i)gain.*life|lifelink|food token|double.*life total'
keep_rule = true

[[role]]
id = "counters"
definition = "puts +1/+1 or other counters on creatures or other permanents, or grows itself repeatedly: backup, bolster, support, adapt, a trigger that adds a counter each time, proliferate."
clauses = [
  "Repeatable self-counter triggers, counters placed on other permanents and proliferate count.",
]
no = "counters the card enters with once; renown; bookkeeping counters (ki, suspect, void, finality, time, fade, charge); counters on players (poison, energy, experience); counters removed as a cost; the spell-counter kind (`counter`)."
src = "rules"
guard = """\
(?i)counter|proliferate|backup|bolster|support|adapt|awaken|connive|dethrone|mentor|evolve|training|amass|\
map token"""
keep_rule = true

[[role]]
id = "blink"
definition = "exiles and returns YOUR permanents (flicker) to reuse their enter triggers or save them."
clauses = []
no = "ordinary graveyard returns (`recursion`, `reanimate`); exiling an opponent's permanent (`removal`)."
src = "rules"
guard = '(?i)exile.*(?:return|put both cards onto the battlefield)'
keep_rule = true
llm_add = false

[[role]]
id = "copy"
definition = "copies spells, permanents or creatures: clones, copy a spell, a token copy of a creature (also `tokens`, copy first), casualty, conspire, replicate, storm."
clauses = [
  "Spell, permanent and token copies count.",
]
no = "being prepared (casting a copy of its own spell face); a card that only copies itself."
src = "rules+llm"
guard = '(?i)cop(?:y|ies)|casualty|conspire|replicate|storm'
keep_rule = true

[[role]]
id = "extra-phase"
definition = "takes extra turns or extra combat phases."
clauses = [
  "Extra turns and additional combats count.",
]
no = "skipping or ending a turn; extra land drops; an extra draw step."
src = "rules"
guard = '(?i)extra (?:turn|combat)|additional (?:combat|turn|beginning phase)'
keep_rule = true

[[role]]
id = "finisher"
definition = "wins or ends the game: an alternate win or lose-the-game effect, a team pump or extra damage meant to kill from a normal board, or a bomb that ends the game if left untouched (an infect giant)."
clauses = []
no = "a large body; a damage doubler; a tutor; one half of a combo; a keyword such as infect or trample on a small creature."
src = "llm"
guard = '(?i)win the game|loses the game|infect|double|damage|\+[x0-9]+/\+[x0-9]+|untap|mana|combat'
keep_rule = true
llm_add = false

[[role]]
id = "evasion"
definition = "makes your attackers unblockable or hard to block, or grants double strike: grants of flying, menace, fear, shadow, horsemanship or 'can't be blocked' to OTHER creatures (a target, your team, an equipped or enchanted creature), including 'up to two target creatures can't be blocked this turn'."
clauses = [
  "Team grants are also anthem.",
]
no = "flying, menace, shadow, landwalk, trample or 'can't be blocked' printed on the card itself; trample alone."
src = "rules+llm"
guard = '''(?i)flying|menace|fear|shadow|horsemanship|can't be blocked|double strike|intimidate'''
keep_rule = true
llm_add = false
