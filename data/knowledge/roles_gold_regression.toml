# roles_gold_regression.toml: the REGRESSION SET (it was the held-out final acceptance set until it had been scored several times and its failure families drove rules, so it is tuning data now). Hand-labelled test set for the card-knowledge role classifier.
#
# Purpose: an independent, fresh set that no classifier, tuner or rule author has seen. It is run ONCE against the frozen
#   classifier (documents/card-knowledge.md acceptance: micro-precision >= 0.90, micro-recall >= 0.85). The tuning set is
#   data/knowledge/roles_gold.toml (207 cards); none of its cards appear here.
# Date: 2026-11-21. Catalog: data/knowledge/oracle.json (35,113 cards).
# Seed: 20261122 (Python random.Random). Sampling script: sample.py next to this file (deterministic; the seed lives here).
#
# Labels are hand-made from Oracle text under the written standard in roles_gold.toml (26 role definitions, conventions 1-21).
# No classifier, regex tagger, carddb tag, rust/ code or roles.json was used to decide any label. Regex searches of oracle.json
# were used only to FIND top-up candidates, each of which was then read and labelled by hand.
#
# Sampling
#   source = "deck"   35 cards: union of `cards` of every deck in data/decks.json `mine`, Commander-legal, not a basic land, not
#                     a layout=meld card, not in roles_gold.toml, sorted by name, shuffled with the seed, lands capped at 7 (6 drawn).
#   source = "random" 45 cards: the same seed over every other Commander-legal, non-basic, non-meld card (not in roles_gold.toml
#                     and not in any `mine` deck), sorted by name, lands capped at 7 (2 drawn). No stratification.
#                     Note: all 21 layout=meld cards (halves and results) are excluded, a superset of "meld results".
#   source = "topup"  25 real Commander cards found by reading Oracle text so that every one of the 26 roles has at least 3
#                     positive cards in the file; several cover more than one role.
#                     Elspeth, Sun's Champion (decoy) and Preordain (topup) are also in a `mine` deck but were not drawn by the seed.
#   source = "decoy"  9 bait cards: look like a role but are not (`not_roles`), or carry a role beside a tempting wrong one.
#
# Labelling rule: a card gets every role one of its abilities fulfils as a MAIN or REPEATABLE effect, at most 4, ordered by
# prominence; the first is `primary`. Incidental effects give nothing. Zero roles: roles = [] and primary = "".
# Conventions 1-21 and the role definitions are exactly those in the header of roles_gold.toml (including convention 1's
# lifelink split, convention 13's planeswalker-ultimate rule and convention 21's prepare rule).
#
# Borderline calls (every one; the written conventions were applied strictly and the call recorded here):
#   Agony Warp           removal. '-0/-3' on a creature is a toughness reduction that kills (convention 8 / definition's -X/-X).
#   Arterial Alchemy     []. Blood tokens are not creature/Treasure/Clue tokens (convention 14), so no tokens; one-shot rummage tokens.
#   Chainer              reanimate only. The symmetric 'All Nightmares get +1/+1' is a minor side ability, so no anthem (convention 6).
#   Chrome Companion     lifegain + gy-hate. 'Put target card from a graveyard on the bottom of its owner's library' repeatedly removes
#                        graveyard cards; counted as gy-hate although it tucks instead of exiling.
#   Cost of Brilliance   draw only. The '+1/+1 counter on up to one target creature' is a rider on a draw spell (not counters).
#   Elder Owyn Lyons     recursion + protection. A static ward grant to other permanents is protection (convention 1 reverse).
#   First Contact        self-mill + selection. Mill four then take a permanent: a dig that nets no card (convention 15), so not draw
#                        and not recursion.
#   Gifts Ungiven        tutor + self-mill, consistent with Opus's ruling that Intuition is self-mill (convention 2).
#   Goblin Battle Jester []. 'target creature can't block this turn' is a one-creature temporary effect like a bare tap (convention 11).
#   Havoc Festival       drain + stax. Symmetric repeated life loss is drain by the Mask of Intolerance precedent.
#   Helitrooper          evasion. The attack trigger grants flying to another creature repeatably (Rattleback Apothecary precedent); the
#                        equip cost reduction is for itself only (convention 7), so no ramp.
#   Keldon Flamesage     draw. Looking at the top X and casting an exiled card free is impulse card advantage (convention 3), not selection.
#   Kura, the Boundless Sky  tokens + fixing. Both modes of the dies trigger count (convention 6); a land search of up to three lands
#                        reaches any colour (convention 5) but goes to hand, so not ramp.
#   Malach of the Dawn   []. Regenerate on itself only protects itself (convention 1 by analogy).
#   Noxious Revival      recursion. Returns a card from a graveyard to a library by the literal definition; not gy-hate (no exile).
#   Orcish Bowmasters    removal + tokens, not counters. Repeatable 1 damage to any target can kill a creature (convention 8 only
#                        excludes a one-shot 1-damage trigger on a body such as Thundermaw Hellkite); amass makes an Army token, and its
#                        later +1/+1 counters are not counted as counters.
#   Orim's Chant         protection, not stax. A one-turn Silence/Fog on a spell is not a standing restriction.
#   Overlaid Terrain     ramp + fixing. 'Add two mana of any one color' on every land; the sacrifice of your own lands is a drawback.
#   Pretender's Claim    []. A one-time temporary tap of lands in combat (convention 11 by analogy).
#   Prologue to Phyresis []. One poison counter on opponents is not a +1/+1 or proliferate effect; the draw is a cantrip.
#   Refurbish            []. 'Return target artifact card from your graveyard to the battlefield': recursion is defined as to hand or
#                        library and reanimate as creatures, so neither definition fits. A taxonomy gap, not a classifier question.
#   Ruin Crab            []. Milling opponents is none of the 26 roles.
#   Sephiroth            drain + lifegain; the sacrifice-to-draw triggers swap a creature for a card, so neither draw nor sac-outlet.
#   Smothering Tithe     tokens + stax. A draw tax with Treasure tokens (Esper Sentinel's tax is stax); Treasure making is not ramp.
#   Staff of Domination  draw + lifegain. Both repeatable ({1} untaps it); bare tap/untap activations give nothing.
#   Subterranean Hangar  []. Stores mana, one mana per tap overall, so nothing beyond a land drop; storage counters are bookkeeping.
#   Together Forever     counters + recursion. Support 2 is one-shot counters on other permanents (like backup, convention 4).
#   Unique Charmed Pants ramp + fixing. A Stickers card whose Oracle text reads '{T}: Add one mana of any color.'; labelled literally.
#   Utvara Hellkite      tokens only. An 8-mana token engine with no win text or mass pump (convention 20), so not finisher.
#   Vito                 drain + lifegain + anthem. Repeatable team lifelink grant is lifegain (convention 1) and a team-wide combat
#                        keyword grant, anthem applied evenly.
#   Scavenging Ooze      gy-hate + counters, not lifegain: the 1 life is a small rider on the same activation (convention 16).
#   Structural Collapse  removal, not wipe or drain: targeted edict of two permanents of their choice (as Decimate), plus one-shot burn.
#   Diamond Faerie       anthem. A repeatable pump of snow creatures is its only non-keyword ability (convention 6).
#   Rise of the Eldrazi  extra-phase + draw + removal: all three effects are the spell's main text; 'can't be countered' is nothing.
#   Cauldron of Essence  4 roles: a death trigger drain+lifegain, and a repeatable sorcery-speed sacrifice that reanimates.
#   Drannith Magistrate  stax + gy-hate, as Grafdigger's Cage (it also stops casting from exile and the command zone).
#   Laboratory Maniac / Felidar Sovereign / Triskaidekaphile  finisher on the Oracle text's own alternate win condition only.



# REVISED 2026-11-21 after the Opus review (/tmp/handoff/opus-kb-gold-final-review.md): 11 role labels changed, 'Unique Charmed Pants'
# dropped (a sticker sheet drawn by the seed: not a deck card), 10 arguable not_roles entries removed. The originals are in
# roles_gold_final.orig.toml and apply_review.py reproduces this file. Added clauses C1-C4 (ward grants and lifelink-only team
# grants; non-Treasure/non-Clue artifact tokens; counters on creatures versus players and amass; recursion includes noncreature
# permanent cards onto the battlefield) are in the main roles_gold.toml header. A repeatable Treasure engine stays tokens-only.
#
