# Data for `cardgen audit` (the tables of the former Python pool audit; edit here).
#
# unsupported_keywords  Scryfall keywords (lower case) the engine does not implement: a card with one is at best
#                       Partial unless a [card_notes] entry or an override note says otherwise. Remove a keyword
#                       when the engine implements it.
# stat_tags             tags that only describe the body; any other tag counts as a role the AI acts on
# deck_only_tags        hand tags whose behaviour lives in the four main decks' AI: an outside deck holding the card
#                       never uses it. [pool_ok] lists the tag values the generic path handles.
# [card_notes."Name"]   status + note for a card; wins over every automatic rule
# [mechanics]           engine-level mechanics: status (Full / Full-auto / Approximate / Partial / Unmodeled) + note
# [[engines.<deck key>]] the key engines of an outside deck (from its "## Sim modeling notes"): label, key cards,
#                       mechanics (keys of [mechanics])

unsupported_keywords = ["adapt", "affinity", "afterlife", "amplify", "annihilator", "backup", "basic landcycling", "bestow", "blitz", "bloodthirst", "bushido", "buyback", "cascade", "casualty", "channel", "cleave", "commander ninjutsu", "craft", "crew", "cycling", "dash", "daybound", "delve", "devour", "disturb", "dredge", "embalm", "emerge", "encore", "entwine", "escape", "eternalize", "evoke", "exploit", "extort", "fabricate", "fear", "flanking", "forage", "forestwalk", "foretell", "gift", "graft", "haunt", "horsemanship", "improvise", "intimidate", "islandwalk", "kicker", "landcycling", "landwalk", "living weapon", "madness", "modular", "monstrosity", "mountainwalk", "multikicker", "myriad", "nightbound", "ninjutsu", "offspring", "overload", "plainswalk", "plot", "prototype", "provoke", "prowess", "rampage", "rebound", "reconfigure", "riot", "shadow", "soulbond", "spectacle", "splice", "split second", "squad", "storm", "sunburst", "surge", "suspend", "swampwalk", "training", "transmute", "unearth"]
stat_tags = ["amt", "bomb", "c", "ck", "convoke", "dt", "f", "flash", "fly", "haste", "human", "leg", "lifelink", "noatk", "pow", "reach", "shaman", "t", "tgh", "trample", "vig", "warrior", "wizard"]
deck_only_tags = ["avarice", "crackle", "mastery", "tide", "x", "yawg"]

[pool_ok]
fill = ["dispute", "stitcher", "wayfinder", "grisly"]
rean = ["animate", "reanimate", "evil", "zombify"]
prot = ["hi", "phase", "indes", "blink", "boots"]

