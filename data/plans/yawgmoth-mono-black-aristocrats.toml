# Deck plan (Phase 4, audit/phase4/plans-design.md). Read by rust/crates/sim-core/src/ai/plan_data.rs.
# PR 1 paired test 2026-10-30 (t5, 2000 games): plan 15.7% vs hand 17.6% (-1.9, 95% CI -4.5..+0.7): level (inside the
# CI, point estimate lower): the hand yawg_prio / yawg_wish are deleted. The hand code counted two undying creatures
# or Mikaeus as the loop and ranked Mikaeus 82 over undying 78/72; PR 2 (phase4-cedh) says so with `counts` (two
# cards of a group) and `bf:<set>` (the undying creatures on the battlefield).
deck = "yawgmoth-mono-black-aristocrats"
default = "plan"

[sets]
undying = ["Geralf's Messenger", "Butcher Ghoul", "Nether Traitor"]
payoffs = ["Blood Artist", "Zulaport Cutthroat", "Bastion of Remembrance", "The Meathook Massacre", "Marionette Apprentice"]

# Win lines (was ai/plans.rs yawg_wish: Yawgmoth, then the loop (Mikaeus, or two undying creatures), then a death
# payoff, then the other combos)
[[line]]
name = "Yawgmoth + Mikaeus + a death payoff"
kind = "drain"
pieces = [["Yawgmoth, Thran Physician"], ["Mikaeus, the Unhallowed"], ["Blood Artist", "Zulaport Cutthroat", "Bastion of Remembrance", "The Meathook Massacre", "Marionette Apprentice"]]

[[line]]
name = "Yawgmoth + two undying creatures + a death payoff"
kind = "drain"
pieces = [["Yawgmoth, Thran Physician"], ["Geralf's Messenger", "Butcher Ghoul", "Nether Traitor"], ["Blood Artist", "Zulaport Cutthroat", "Bastion of Remembrance", "The Meathook Massacre", "Marionette Apprentice"]]
counts = [1, 2, 1]

[[line]]
name = "Gravecrawler + Phyrexian Altar + a Zombie + a death payoff"
combo = "Gravecrawler + Phyrexian Altar + a Zombie + a death payoff"

[[line]]
name = "Reassembling Skeleton / Gravecrawler + Pitiless Plunderer + an altar + a death payoff"
combo = "Reassembling Skeleton / Gravecrawler + Pitiless Plunderer + an altar + a death payoff"

[[line]]
name = "Phyrexian Altar + Reassembling Skeleton + Pawn of Ulamog / Sifter of Skulls + a death payoff"
combo = "Phyrexian Altar + Reassembling Skeleton + Pawn of Ulamog / Sifter of Skulls + a death payoff"

# Cast priorities (was yawg_prio): Yawgmoth as soon as it can be cast; with Yawgmoth out and no loop, Mikaeus 82, an
# undying creature 78 with one out (72 with none); with the loop, a death payoff 80 while none is out
[[prio]]
commander = true
value = 86

[[prio]]
cards = ["Mikaeus, the Unhallowed"]
when = ["out:Yawgmoth, Thran Physician & not out:Mikaeus, the Unhallowed"]
value = 82

[[prio]]
cards = ["Geralf's Messenger", "Butcher Ghoul", "Nether Traitor"]
when = ["out:Yawgmoth, Thran Physician & not out:Mikaeus, the Unhallowed & bf:undying=1"]
value = 78

[[prio]]
cards = ["Geralf's Messenger", "Butcher Ghoul", "Nether Traitor"]
when = ["out:Yawgmoth, Thran Physician & not out:Mikaeus, the Unhallowed & bf:undying=0"]
value = 72

[[prio]]
cards = ["Blood Artist", "Zulaport Cutthroat", "Bastion of Remembrance", "The Meathook Massacre", "Marionette Apprentice"]
when = ["out:Yawgmoth, Thran Physician & out:Mikaeus, the Unhallowed & not drain-payoff", "out:Yawgmoth, Thran Physician & bf:undying>=2 & not drain-payoff"]
value = 80
