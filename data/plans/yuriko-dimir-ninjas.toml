# Deck plan (Phase 4, audit/phase4/plans-design.md). Read by rust/crates/sim-core/src/ai/plan_data.rs.
# PR 1 paired test 2026-10-30 (t4, 2000 games): plan 18.1% vs hand 20.9% (-2.8, 95% CI -5.5..-0.1): worse; the
# derived wish list was the loss (tutors fetched Brainstorm or Dig Through Time where the hand list fetches Rhystic
# Study). PR 2 (phase4-cedh) rewrites it with the schema extensions: Scroll Rack and Top put a card back only from
# the battlefield (`bf:`), a tutor that puts its card on top is a put-back itself (`?to-top`), Rhystic Study goes
# ahead of the line while the line is two or more steps away (`engines_ahead`), and Brainstorm's value reads the
# rest of the hand (`hand-max-mv`).
deck = "yuriko-dimir-ninjas"
default = "hand"
# card engines: Rhystic Study ahead of a far line, Mystic Remora once no line wants a card (was t4::yuriko_wish's
# list without a put-back: Rhystic Study, Scroll Rack, Top, Mystic Remora)
engines_ahead = ["Rhystic Study"]
engines = ["Mystic Remora"]

[style]
temp = 1.0
aggression = 0.8
caution = 0.5

[commander]
prio = 15
turn = 6

[knobs]
top_pref = "mv"

# Win line (was t4::yuriko_wish): Yuriko's reveal wants a way to put a card back on top first (Scroll Rack or Top on
# the battlefield, Brainstorm, or the tutor itself putting its card on top), then the big mana values to put there
[[line]]
name = "Yuriko reveal"
kind = "commander-damage"
ordered = true
pieces = [["bf:Scroll Rack", "bf:Sensei's Divining Top", "Brainstorm", "?to-top"], ["Dig Through Time", "Treasure Cruise"]]
when = ["commander-out", "commander-zone"]

# Cast priorities (was t4::yuriko_prio): cantrips before a ninjutsu combat stack the reveal (Brainstorm only with a
# big card to put back, else 45); evasive one- and two-drops carry Yuriko in
[[prio]]
cards = ["Brainstorm"]
when = ["ninjutsu-window & hand-max-mv>=5"]
value = 72

[[prio]]
cards = ["Brainstorm"]
when = ["ninjutsu-window"]
value = 45

[[prio]]
cards = ["Ponder"]
when = ["ninjutsu-window"]
value = 72

[[prio]]
cards = ["Ornithopter", "Changeling Outcast", "Slither Blade", "Faerie Seer", "Spectral Sailor", "Triton Shorestalker", "Moon-Circuit Hacker", "Ingenious Infiltrator"]
when = ["creatures<2"]
value = 80
else = 58

[[prio]]
creature = true
flying = true
max_mv = 2
when = ["creatures<2"]
value = 80
else = 58
