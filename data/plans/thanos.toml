# Deck plan (Phase 4, audit/phase4/plans-design.md). Read by rust/crates/sim-core/src/ai/plan_data.rs through the
# Tier 6 plan slots (impls/t6_plans.rs). JD's Thanos, the Mad Titan turbo deck (Scion's seat and plan since 2026-10-30;
# the list is JD's physical deck since 2026-11-01, 22 cards changed from the Scion v1 base): fast
# mana, rituals and dorks into Thassa's Oracle + Demonic Consultation / Tainted Pact or Underworld Breach + Lion's Eye
# Diamond + Brain Freeze. Thanos's power-up (a parity wipe) is card code (impls/t6_thanos.rs), not this plan.
#
# Only the keep rule has an opinion (was Scion's, the Rograkh/Silas turbo rule with this list's rituals, tutors,
# payoffs and engines; PROVISIONAL until JD decides the mulligans, D11). Cast priority, wish list, hold-up and go-now
# leave every decision to the shared Tier 6 table rules and the generic AI.
# Scion's paired test (t6, --deck scion, 2000 games): byte-identical to the hand code (Scion 30.1%, CI 28.1-32.1).
deck = "thanos"
default = "plan"

# Scion's style (was ai::T6_JD_STYLES): the default temperature and aggression, less caution than the pool's 0.5, so
# it spends its mana on its plan instead of passing with a counterspell up
[style]
temp = 1.0
aggression = 0.6
caution = 0.35

[sets]
tutors = ["Demonic Tutor", "Vampiric Tutor", "Mystical Tutor", "Enlightened Tutor", "Worldly Tutor", "Imperial Seal", "Gamble", "Diabolic Intent", "Grim Tutor", "Merchant Scroll", "Eladamri's Call", "Beseech the Mirror", "Intuition", "Demonic Consultation", "Tainted Pact"]
payoffs = ["Necropotence", "Ad Nauseam", "Underworld Breach", "Brain Freeze"]
# an engine alone does not win: it counts as action only with fast mana
engines = ["Rhystic Study", "Mystic Remora", "Esper Sentinel", "Sylvan Library"]
# a tutor, a payoff or the Oracle
action = ["Demonic Tutor", "Vampiric Tutor", "Mystical Tutor", "Enlightened Tutor", "Worldly Tutor", "Imperial Seal", "Gamble", "Diabolic Intent", "Grim Tutor", "Merchant Scroll", "Eladamri's Call", "Beseech the Mirror", "Intuition", "Demonic Consultation", "Tainted Pact", "Necropotence", "Ad Nauseam", "Underworld Breach", "Brain Freeze", "Thassa's Oracle"]

# Fast mana and a plan beat land count: `fast` = the hand's mana pieces that count by turn 2 plus its rituals, `mana`
# = what the hand makes by turn 2 plus its rituals (t6_keep::mana). A settled hand (2-4 lands after a mulligan) is kept.
[mulligan]
fast_mana = true
# one-shot mana: rituals and spirit guides
rituals = ["Dark Ritual", "Cabal Ritual", "Desperate Ritual", "Rite of Flame", "Seething Song", "Manamorphose", "Elvish Spirit Guide", "Simian Spirit Guide"]

# ship all-land hands
[[mulligan.rule]]
when = ["hand-lands>=6"]
keep = false

# no colours from lands: only with three fast mana pieces and a tutor or payoff to cast
[[mulligan.rule]]
when = ["hand-lands=0 & fast>=3 & hand:tutors>=1", "hand-lands=0 & fast>=3 & hand:payoffs>=1"]
keep = true

[[mulligan.rule]]
when = ["hand-lands=0"]
keep = false

# a 1-lander needs the mana (rituals count) and a payoff or tutor to spend it on
[[mulligan.rule]]
when = ["hand-lands=1 & mana<one-lander", "hand-lands=1 & hand:action=0 & hand:engines=0", "hand-lands=1 & hand:action=0 & fast<1"]
keep = false

# lands-and-spells hands with no payoff or tutor, or no mana to cast it
[[mulligan.rule]]
when = ["mana<2", "hand:action=0 & hand:engines=0 & fast<2", "hand:action=0 & fast<1"]
keep = false

[[mulligan.rule]]
when = ["hand-lands>=5 & fast=0 & hand:action<2"]
keep = false
