# JD's Thanos, the Mad Titan Cali Commander artifact-combo deck (decklists/cali_commander/thanos-artifact-combo.md, key
# `thanos`; rewritten 2026-11-13 for the Cali list that replaced the artifacts-and-Dragons list). `thanos` is not a Tier
# 6 key (the `thrasios` key took the Tier 6 rules), so the generic pool policy reads this file: `[style]`, `[commander]`,
# `[key_cards]`, `[[line]]`, `[[wish]]`, `[[prio]]`, `[[hold]]` and `[mulligan]`. The plan: fast mana and Thanos first,
# the engines (The One Ring, Rhystic Study, Mystic Remora, Urza, Crucible), then Basalt Monolith + Rings of Brighthearth
# into Walking Ballista. Thanos's power-up is card code (impls/t6_thanos.rs), not this plan.
# PROVISIONAL: the style numbers, priorities and keep rule come from the pilot guide in the deck document, not from a
# paired test (no sims yet). Left out until the engine models them: Tinker into Blightsteel Colossus, Sneak Attack,
# Staff of Domination + Faeburrow Elder, and Thassa's Oracle with Demonic Consultation or Tainted Pact (the plan has no
# lines for them), and the 1v1, 30-life Cali rules themselves. The schema can't express the choice of odd or even for
# the power-up.
deck = "thanos"
default = "plan"
engines = ["The One Ring", "Rhystic Study", "Mystic Remora", "Urza, Lord High Artificer", "Crucible of Worlds"]

# Thanos plans to be down on turn 2-3 and then play value, not a goldfish combo: pool defaults for temperature, a little
# above the pool's attack, less caution than the pool's 0.5 only while ahead on mana.
[style]
temp = 1.0
aggression = 0.6
caution = 0.5

# The cheapest threat and the enabler of Deflecting Swat and Jeska's Will: cast on turn 2 when {R}{W}{B} is there (the
# colourless rocks can't pay for him), before the engines.
[commander]
prio = 88
turn = 2

[key_cards]
"Walking Ballista" = 70
"Urza, Lord High Artificer" = 74
"Elesh Norn, Mother of Machines" = 66

# Win line: Basalt Monolith + Rings is two cards and then any mana sink: Walking Ballista from hand (a huge X), Staff of
# Domination on the battlefield (draw to the Ballista) or Urza (the whole library).
[[line]]
name = "Basalt Monolith + Rings of Brighthearth + a mana sink"
kind = "combo"
pieces = [["Basalt Monolith"], ["Rings of Brighthearth"], ["Walking Ballista", "Staff of Domination", "Urza, Lord High Artificer"]]

# What the tutors fetch (the guide's "What to tutor for"): the combo's missing piece first, an engine on turns 2-3 when
# nothing is going, the wipe or the Rings when the board can't be beaten.
[[wish]]
cards = ["Basalt Monolith", "Rings of Brighthearth"]
when = ["lands+rocks>=3"]
score = 90

[[wish]]
cards = ["Staff of Domination", "Walking Ballista"]
when = ["out:Basalt Monolith & out:Rings of Brighthearth"]
score = 95

[[wish]]
cards = ["The One Ring", "Rhystic Study"]
when = ["turn<=3"]
score = 80

[[wish]]
cards = ["Elesh Norn, Mother of Machines", "Meteor Golem"]
when = ["opp-power>=15"]
score = 76

# Acceleration and fixing are the first plays; Thanos and the engines next; the big top end last.
[[prio]]
cards = ["Sol Ring", "Mana Crypt", "Mana Vault", "Lotus Petal", "Arcane Signet", "Mind Stone", "Birds of Paradise",
    "Llanowar Elves", "Paradise Druid", "Avacyn's Pilgrim", "Talisman of Hierarchy", "Talisman of Progress",
    "Thought Vessel", "Fellwar Stone"]
when = ["turn<=4"]
value = 86
else = 46

[[prio]]
cards = ["Rhystic Study", "The One Ring", "Mystic Remora"]
when = ["turn<=6"]
value = 78
else = 62

[[prio]]
cards = ["Urza, Lord High Artificer", "Crucible of Worlds", "Coalition Relic"]
value = 74

# The combo pieces: Basalt Monolith first, Rings once it is held (or out); the Ballista is the kill, not a body
[[prio]]
cards = ["Basalt Monolith"]
value = 82

[[prio]]
cards = ["Rings of Brighthearth"]
when = ["have:Basalt Monolith", "out:Basalt Monolith"]
value = 80
else = 44

[[prio]]
cards = ["Walking Ballista"]
when = ["have:Basalt Monolith & have:Rings of Brighthearth & lands<8", "out:Basalt Monolith & have:Rings of Brighthearth & lands<8"]
value = 0

[[prio]]
cards = ["Walking Ballista"]
when = ["lands>=6"]
value = 56
else = 40

[[prio]]
cards = ["Elesh Norn, Mother of Machines", "Hangarback Walker", "Primeval Titan", "Windborn Muse"]
value = 68

# The top end: after the board is built
[[prio]]
cards = ["Meteor Golem"]
when = ["lands+rocks>=7"]
value = 66
else = 20

[[hold]]
card = "Teferi's Protection"
protects = ["commander", "The One Ring"]

# The guide's keep rule: 2-5 lands (a lone land only with three fast pieces), mana by turn 2-3, and something to do.
[sets]
tutors = ["Demonic Tutor", "Vampiric Tutor", "Enlightened Tutor", "Mystical Tutor", "Worldly Tutor", "Grim Tutor",
    "Tinker"]
engines = ["The One Ring", "Rhystic Study", "Mystic Remora", "Urza, Lord High Artificer", "Crucible of Worlds"]
pieces = ["Basalt Monolith", "Rings of Brighthearth", "Walking Ballista", "Staff of Domination", "Thassa's Oracle",
    "Blightsteel Colossus"]

[mulligan]
fast_mana = true

[[mulligan.rule]]
when = ["hand-lands>=6"]
keep = false

[[mulligan.rule]]
when = ["hand-lands=0"]
keep = false

[[mulligan.rule]]
when = ["hand-lands=1 & fast<3"]
keep = false

# nothing to do: no tutor, engine or combo piece
[[mulligan.rule]]
when = ["hand:tutors=0 & hand:engines=0 & hand:pieces=0"]
keep = false

[[mulligan.rule]]
when = ["mana<2"]
keep = false
