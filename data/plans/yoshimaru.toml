# Deck plan (Phase 4, audit/phase4/plans-design.md). Read by rust/crates/sim-core/src/ai/plan_data.rs and the generic
# policy (ai/plans.rs `config`). JD's Yoshimaru, Ever Faithful + Tymna the Weaver deck (key `yoshimaru`, tiers t4-t5,
# registered 2026-11-20: decklists/JD/yoshimaru-tymna-blink.md, white-black blink and enter-the-battlefield value). The
# plan: Yoshimaru on turn 1 and Tymna on turn 3 (his counters need him out first), a rock or an enter-effect creature a
# turn after, Delney to double Tymna and the enters, and the two catalogue lines below (Vito / Exquisite Blood and
# Heliod / Walking Ballista). The blink cards, Yoshimaru's counters and Tymna's draw are card code, not this file.
# PROVISIONAL: the priorities come from the guide's game plan, not from a paired test (no sim has run on this list yet).
# The keep rule is the generic one (two to five lands, no piece needed), a placeholder until a measurement: the guide's
# mulligan table is not expressed here. Left out (the schema can't express it): the order rule's second half (Tymna
# only after Yoshimaru is out: a priority gap here, not a gate), Chrome Mox's imprint choice, the end-step plays of the
# flash creatures, the Archangel of Thune + Walking Ballista and Restoration Angel + Felidar Guardian lines (not in the
# combo catalogue), and the guide's hold rules for blink spells and sweeper answers.
# Equipment package (the Equipment, its carriers and enablers; the guide's "The Equipment package"): the rows below are
# COPIED from data/plans/cloud.toml's tuned rules (the same cards and values, Cloud's commander row aside), not measured on
# this list, so they are provisional. Deliberately left out: Cloud's `[equip] holder = "commander"` (it would put the
# Swords on Yoshimaru or Tymna; the guide wants fliers and Tymna only with Swiftfoot Boots, because +power turns off
# Delney's doubling for her), the choice of carrier for Sting and Sword of Hearth and Home (protection from white:
# never on Walking Ballista), Flawless Maneuver in response to our own Wrath of God, never returning Walking Ballista
# with Court of Ardenvale, and blinking the Equipment instead of the carrier: the generic policy decides all of these,
# so a weak result may be the AI and not the list.
deck = "yoshimaru"
default = "plan"
# card engines the tutors want once no line wants a card
engines = ["Delney, Streetwise Lookout", "Elas il-Kor, Sadistic Pilgrim", "Elesh Norn, Mother of Machines", "The One Ring"]

# the Equipment in the list: what `hand:equipment` / `bf:equipment` count
[sets]
equipment = ["Buster Sword", "Mithril Coat", "Sting, the Glinting Dagger", "Swiftfoot Boots", "Sword of Feast and Famine", "Sword of Fire and Ice", "Sword of Hearth and Home"]

# Yoshimaru costs {W}: cast him from turn 1, ahead of Tymna. Fallback only: both commanders match a [[prio]] rule
# below, and the rule's priority wins before this block is read.
[commander]
prio = 92
turn = 1

# Silence / Orim's Chant before a line goes, as a Tier 6 deck does (`t6_table::protect_before_go`); opt-in knob, measured
# on this deck only (Stage 4). The Tier 6 table's other slots stay closed to this deck.
[knobs]
protect_before_go = true

# win lines, best first: the tutors want the first missing piece
[[line]]
name = "Vito / Enduring Tenacity / Sanguine Bond / Marauding Blight-Priest + Exquisite Blood / Bloodthirsty Conqueror"
combo = "Vito / Enduring Tenacity / Sanguine Bond / Marauding Blight-Priest + Exquisite Blood / Bloodthirsty Conqueror"

[[line]]
name = "Heliod, Sun-Crowned + Walking Ballista"
combo = "Heliod, Sun-Crowned + Walking Ballista"

# Delney first when both commanders can be out: she doubles Tymna's draw and most enters
[[wish]]
cards = ["Delney, Streetwise Lookout"]
when = ["turn<=6"]
score = 80

# Cast priorities: Yoshimaru, then Tymna (3 less per tax); free and cheap mana early; Delney before the payoffs
[[prio]]
cards = ["Yoshimaru, Ever Faithful"]
value = 92

[[prio]]
cards = ["Tymna the Weaver"]
value = 90
per_tax = -3

[[prio]]
cards = ["Chrome Mox", "Mox Amber", "Sol Ring", "Mana Vault"]
when = ["turn<=3"]
value = 88
else = 60

[[prio]]
cards = ["Delney, Streetwise Lookout"]
value = 84

# Equipment package, copied from Cloud's rules: the Swords first, the enablers once there is Equipment to work, Boots and
# Skrelv (in Zack Fair's priority since 2026-11-22) for the commanders, Court of Ardenvale once the mana is there
[[prio]]
cards = ["Sword of Fire and Ice"]
value = 80

[[prio]]
cards = ["Sword of Feast and Famine"]
value = 78

[[prio]]
cards = ["Sword of Hearth and Home"]
value = 76

[[prio]]
cards = ["Puresteel Paladin"]
when = ["hand:equipment>=1"]
value = 81
else = 57

[[prio]]
cards = ["Ardenn, Intrepid Archaeologist"]
when = ["hand:equipment+bf:equipment>=1"]
value = 72
else = 54

[[prio]]
cards = ["Kor Outfitter"]
when = ["hand:equipment+bf:equipment>=1"]
value = 66
else = 46

[[prio]]
cards = ["Swiftfoot Boots"]
when = ["commander-out"]
value = 74

[[prio]]
cards = ["Swiftfoot Boots"]
when = ["opp-removal-up>=1"]
value = 70
else = 50

[[prio]]
cards = ["Skrelv, Defector Mite"]
when = ["commander-out"]
value = 66
else = 54

[[prio]]
cards = ["Court of Ardenvale"]
when = ["lands>=6"]
value = 64
else = 50

# the protection cards are kept for the commanders and the engine, not cast proactively
[[hold]]
card = "Teferi's Protection"
protects = ["commander"]

[[hold]]
card = "Eerie Interlude"
protects = ["commander"]

# keep two to five lands, whatever else the hand holds: the generic rule, a placeholder pending measurement. It does
# not follow the guide's table (a white source by turn 1 or 2 and a reason to go); `pieces = 1` would send back most
# playable hands, as only about 46% of 7-card hands hold one of the eight line and engine cards.
[mulligan]
lands = [2, 5]
pieces = 0
