# Deck plan (audit/phase4/plans-design.md). Read by rust/crates/sim-core/src/ai/plan_data.rs and the generic policy
# (ai/plans.rs `config`). JD's Aragorn, the Uniter deck (four-colour spell burn, key `aragorn`, tiers t4-t5), built
# 2026-11-06 from the Kefka and Sauron decks. PROVISIONAL: written from the deck document's game plan
# (decklists/JD/aragorn-uniter.md, "Game plan" and "How it wins"), not from a paired test. The Breach line and its
# rituals are Kefka's old plan (data/plans/kefka.toml, retired the same day).
# Left out (the schema can't express it): the Breach turn's own gate (two escape candidates and five mana, held for
# the storm turn); casting cheap red spells after Aragorn for his 3 damage each (the generic policy casts what it can).
deck = "aragorn"
default = "plan"
# The Breach rebuild's swap-test cards (2026-11-10, JD; packages B1-B4 in audit/aragorn/FINDINGS.md): the rules below
# name them so the paired runs play them; a rule naming one does nothing while the list doesn't hold it
candidates = ["Lion's Eye Diamond", "Birgi, God of Storytelling // Harnfel, Horn of Bounty", "Enlightened Tutor",
    "Gamble", "Grand Abolisher", "Mana Vault", "Chrome Mox", "Grim Monolith", "Noble Hierarch", "Thassa's Oracle",
    "Baral, Chief of Compliance", "Pyretic Ritual", "Strike It Rich"]
engines = ["Rhystic Study", "Smothering Tithe", "Sylvan Library", "Niv-Mizzet, Parun", "Talrand, Sky Summoner",
    "Fiery Emancipation", "Guttersnipe", "Storm-Kiln Artist"]

[style]
temp = 1.0
aggression = 0.65
caution = 0.55

# Aragorn is the engine: every spell after him triggers; cast him as soon as {R}{G}{W}{U} is up
[commander]
prio = 90
turn = 3

[key_cards]
"Underworld Breach" = 74
# 0: never cast on its own (the preflight saw it cast in 99% of the games drawn, exposed and adding no storm): the
# Breach line casts it from hand, for the storm count and its mana
"Lion's Eye Diamond" = 0
"Fiery Emancipation" = 72
"Jeska's Will" = 66
"Niv-Mizzet, Parun" = 64
"Talrand, Sky Summoner" = 62

# win lines, best first: the tutors want the first missing piece of the closest one. With Lion's Eye Diamond, Breach
# and Brain Freeze are a near-certain win (the Diamond pays every escape, Brain Freeze at yourself refuels): the line
# is played by impls/breach_line.rs, Thassa's Oracle its other finish
[[line]]
name = "Underworld Breach + Lion's Eye Diamond + Brain Freeze"
kind = "combo"
pieces = [["Underworld Breach"], ["Lion's Eye Diamond"], ["Brain Freeze"]]

[[line]]
name = "Underworld Breach + a storm card + a ritual"
kind = "combo"
pieces = [["Underworld Breach"], ["Brain Freeze", "Grapeshot"], ["Seething Song", "Desperate Ritual", "Pyretic Ritual", "Rite of Flame", "Lotus Petal", "Manamorphose", "Strike It Rich"]]

[[line]]
name = "Fiery Emancipation + red spells"
kind = "value"
pieces = [["Fiery Emancipation"], ["Guttersnipe", "Firebrand Archer", "Young Pyromancer", "Storm-Kiln Artist"]]

[[wish]]
cards = ["Rhystic Study", "Smothering Tithe", "Sylvan Library"]
when = ["turn<=3"]
score = 80

# the Breach line is the plan from turn 3 (it no longer waits for Aragorn and five mana): Breach and the Diamond
# first (Enlightened Tutor and Gamble find them), then Brain Freeze (Mystical Tutor) once Breach is in hand or out
[[wish]]
cards = ["Underworld Breach", "Lion's Eye Diamond"]
when = ["turn>=3"]
score = 90
plus_line = 10

[[wish]]
cards = ["Brain Freeze"]
when = ["have:Underworld Breach"]
score = 88

[[wish]]
cards = ["Fiery Emancipation"]
when = ["commander-out & lands+rocks>=6"]
score = 86

# cast priorities: mana and fixing first (Aragorn needs all four colours), then the draw engines, then Aragorn
[[prio]]
cards = ["Sol Ring", "Mana Vault", "Grim Monolith", "Chrome Mox", "Arcane Signet", "Lotus Petal", "Birds of Paradise",
    "Llanowar Elves", "Noble Hierarch", "Paradise Druid", "Nature's Lore", "Faeburrow Elder"]
when = ["turn<=4"]
value = 86
else = 44

# Birgi ({R} for every spell: the storm turn's mana) and Baral (instants and sorceries {1} less, a loot per counter)
# come down early; Grand Abolisher before the Breach turn (nobody answers on our turn)
[[prio]]
cards = ["Birgi, God of Storytelling // Harnfel, Horn of Bounty", "Baral, Chief of Compliance", "Grand Abolisher"]
when = ["turn<=6"]
value = 74
else = 62

[[prio]]
cards = ["Rhystic Study", "Smothering Tithe", "Sylvan Library"]
when = ["turn<=6"]
value = 78
else = 60

[[prio]]
cards = ["Lightning Greaves"]
when = ["commander-out"]
value = 80
else = 50

[[prio]]
cards = ["Guttersnipe", "Firebrand Archer", "Third Path Iconoclast", "Young Pyromancer", "Storm-Kiln Artist",
    "Talrand, Sky Summoner", "Niv-Mizzet, Parun"]
value = 66

[[prio]]
cards = ["Fiery Emancipation"]
when = ["commander-out", "have:Guttersnipe", "out:Guttersnipe"]
value = 76
else = 50

# Aura Shards (each creature entering, ours or a token, destroys an artifact or enchantment): no generic rule casts it
# (it sat in hand in every game of the 11/06 analysis); cast once the board can start making creatures
[[prio]]
cards = ["Aura Shards"]
when = ["turn>=3"]
value = 58
else = 30

[[hold]]
card = "Teferi's Protection"
protects = ["commander", "Fiery Emancipation", "Underworld Breach"]

[[hold]]
card = "Heroic Intervention"
protects = ["commander", "Fiery Emancipation"]

[sets]
tutors = ["Mystical Tutor", "Worldly Tutor", "Enlightened Tutor", "Gamble"]
engines = ["Rhystic Study", "Smothering Tithe", "Sylvan Library", "Niv-Mizzet, Parun", "Talrand, Sky Summoner"]
pieces = ["Underworld Breach", "Lion's Eye Diamond", "Brain Freeze", "Grapeshot", "Thassa's Oracle", "Fiery Emancipation",
    "Jeska's Will"]

[mulligan]
fast_mana = true

[[mulligan.rule]]
when = ["hand-lands>=6"]
keep = false

[[mulligan.rule]]
when = ["hand-lands=0"]
keep = false

[[mulligan.rule]]
when = ["hand-lands=1 & fast<2"]
keep = false

[[mulligan.rule]]
when = ["mana<2"]
keep = false
