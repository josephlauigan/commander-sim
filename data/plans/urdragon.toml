# Deck plan (Phase 4, audit/phase4/plans-design.md). Read by rust/crates/sim-core/src/ai/plan_data.rs and the generic
# policy (ai/plans.rs `config`). JD's The Ur-Dragon deck (decklists/JD/ur-dragon-equipment.md, Bracket 4, tier t5,
# 2026-10-30): Godo, Bandit Warlord fetches Helm of the Host and the hasty token copies take a combat each (infinite
# combats); the backups are Combat Celebrant + Helm and Dualcaster Mage + Twinflame. The lines are the catalogue's
# combos (impls/t6_combos_godo.rs, impls/combos.rs): `combo_options` offers them, the tutors want their pieces.
# The Ur-Dragon's eminence and attack trigger are card code (impls/t45_urdragon.rs); no deck AI is hand-written.
deck = "urdragon"
default = "plan"
# card engines the tutors want once no line wants a card
engines = ["Rhystic Study", "The One Ring", "Smothering Tithe", "Sylvan Library"]

# a combo deck that attacks: the pool's aggression, a little less caution so it taps out for Godo
[style]
temp = 1.0
aggression = 0.65
caution = 0.45

# The Ur-Dragon costs nine and works from the command zone (eminence): cast him late, as a card engine
[commander]
prio = 40
turn = 6

# Godo is the main line; Gilgamesh digs six for Equipment
[key_cards]
"Godo, Bandit Warlord" = 88
"Gilgamesh, Master-at-Arms" = 70

# win lines, best first: the tutors want the first missing piece of the closest one
[[line]]
name = "Godo + Helm of the Host (Hammer of Nazahn out)"
combo = "Godo + Helm of the Host (Hammer of Nazahn out)"

[[line]]
name = "Godo + Helm of the Host (Brass Squire attaches)"
combo = "Godo + Helm of the Host (Brass Squire attaches)"

[[line]]
name = "Godo + Helm of the Host (equip {5})"
combo = "Godo + Helm of the Host (equip {5})"

[[line]]
name = "Godo + Peter Parker's Camera copies the enter trigger"
combo = "Godo + Peter Parker's Camera copies the enter trigger"

[[line]]
name = "Godo + Hammer first, then Jaxis copies Godo"
combo = "Godo + Hammer first, then Jaxis copies Godo"

[[line]]
name = "Helm of the Host + Combat Celebrant"
combo = "Helm of the Host + Combat Celebrant"

[[line]]
name = "Dualcaster Mage + a copy spell"
combo = "Dualcaster Mage + a copy spell"

# protection held for the combo turn, not cast proactively
[[hold]]
card = "Teferi's Protection"
protects = ["Godo, Bandit Warlord", "Helm of the Host"]

# keep two to five lands with a piece of a line (or an engine)
[mulligan]
lands = [2, 5]
pieces = 1
