# JD's The Ur-Dragon five-colour Dragons deck (decklists/JD/urdragon-five-colour-dragons.md, key `urdragon`, tier t5;
# rewritten 2026-11-14 for the list with Utvara Hellkite, Summon: Bahamut and the spells package; 2026-11-23: Sylvan Library, Urza's Incubator and Jeska's Will in; 2026-11-23: Talisman of Hierarchy and Kyodai, Soul of Kamigawa in, Klauth, Unrivaled Ancient out; 2026-11-24: the speed and protection/draw packages: Mithril Coat, The Theorist, Giver of Runes, Talisman of Curiosity, Dragonspeaker Shaman, Hellkite Courser, Tymna the Weaver and Sapphire Medallion in, and eight cards out, whose rows are gone). The
# deck has no hand-written AI code, so the generic policy reads this file: `[style]`, `[commander]`, `[key_cards]`,
# `[[line]]`, `[[wish]]`, `[[prio]]`, `[[hold]]` and `[mulligan]`. The plan: ramp first, an engine (Rhystic Study, The
# One Ring, Terror of the Peaks) on turns 3-5, then The Ur-Dragon and the Dragons, then attack; the Garth One-Eye +
# Spark Double + Twinflame + Doubling Season loop is the second win line (see the card-code fixes below).
# PROVISIONAL: the style numbers, priorities and the keep rule come from the pilot guide in the deck document, not from a
# paired test (no sims yet). Deliberately NOT listed in `[[prio]]`: Twinflame, Crux of Fate,
# removal and the protection spells. A positive priority turns a held card into a plain main-phase cast, which skips the
# wipe logic (your own losses count 1.2x) and spends Twinflame outside the combo.
# Left out, because the schema can't express them: "an opponent has shown a wipe" (hold the Dragons), hold up mana or go (Tier 6 only), Dromoka before the combo, Twinflame into open blue mana,
# Cavern of Souls naming Dragon, the tutor target for "the table's best creature" (`opp-power` is the whole table's total
# power), leaving a seven-drop in hand for The Ur-Dragon's free drop (the AI may hard-cast it), Morophon / Rivaz cost
# sequencing, "seven mana and no Dragon" for the Terror of the Peaks / Goldspan row (it uses `lands+mana-perms>=5` and
# has no Dragon check), a colour check for a hand of several colourless or off-colour sources beyond the rows below, the
# 5- and 6-card keep rows and the bottom order.
# Card-code fixes (the Garth branches run only for the raw key `urdragon`, so no other deck's choices change): The
# Ur-Dragon's free drop never puts Tiamat onto the battlefield (`ur_pick`: her search is "if you cast it"); Twinflame is
# held while the Garth line is alive (Garth, Spark Double and Doubling Season each in hand, library or on the
# battlefield) and released when a piece is dead, the table can kill you, or this turn's copies and ready fliers are
# lethal (`mine::twinflame`: counts Doubling Season's copies, the token cap, and Terror of the Peaks' triggers replayed
# one at a time where the engine would aim them; combat damage counts only with no attack cap out and no tax on that
# opponent, and an opponent whose damage is prevented, halved, floored or turned into poison counts for nothing);
# Spark Double copies Garth when Doubling Season (in
# hand or out) and Twinflame (in hand) are there, or a Demonic or Vampiric Tutor can fetch the missing one
# (`common::spark_copy`). The fair Twinflame resolver itself now makes Doubling Season's copies and skips targets with
# protection from red for every seat (Twinflame is in no other registered deck). Limits of the lethal release: it is
# released only when the estimate finds a kill and the engine then makes one on a copy of the game that sees only the
# visible board (Twinflame cast, then everything attacks each opponent the estimate found; `mine::twinflame_confirm`;
# the AI's own look-ahead copies use the estimate alone); a later copy's entry also triggers the earlier Terror token,
# which the estimate leaves out (it only delays the release); answers an opponent casts from the hand (a fog, Teferi's
# Protection, Angel's Grace, Tishana's Tidebinder, a counter, removal) and the cards it draws during the line are not
# known; under a tax or a cap, or against Gisela, Angel's Grace, Phyrexian Unlife or Serra's emblem, or while the copies
# enter tapped (Blind Obedience, Thalia), only Terror's triggers can release it; it also stays held while an opponent
# controls a permanent that triggers on the line itself (Soul Warden, Authority of the Consuls, Sunscorch Regent,
# Aurelia, Exquisite Blood, Intruder Alarm, Koma, Sting), and counts no combat damage to an opponent with a block or
# defence effect out (Spore Frog, Mirage Mirror, Yawgmoth, Brimaz), even where the engine would kill; the check's
# blocks are the engine's heuristic ones (three samples, each must kill), not an opponent's block search; the check
# follows the engine where the engine departs from the rules (Chalice, a disabled Opposition); and the AI's real attack,
# chosen afterwards, may not be the killing one.
# Spark Double is held (`t45_urdragon_combos::spark_hold`, read by `brain::card_utility` and `ur_pick`) while Garth is not
# on the battlefield and the rest of the line is near (the same near test as the copy above: Doubling Season out or in
# hand and Twinflame in hand, or a Demonic or Vampiric Tutor for the missing one) with Garth in hand and payable next
# turn in count and in colours ({W}{U}{B}{R}{G}: `payable_next_turn`, tapped lands and mana permanents count), or in the
# library with Doubling Season on the battlefield (the wish row sends a tutor to Garth only then) and a tutor of its own
# that is payable next turn (Worldly Tutor fetches only Garth). It is released when a piece is dead, Garth is out (then
# the copy decides), Garth (or the tutor that fetches it) cannot be paid for by next
# turn, or the table's danger (incoming damage over life) reaches 1.0. While it is held Twinflame is held too (the
# line stays alive). Not done: releasing the hold for a better copy target.
# The `plays` set (the mulligan's "something to do") leaves out Mox Jasper (dead before a Dragon), Urza's Incubator
# (dead before a Dragon, added 2026-11-23, provisional), Jeska's Will, Garth One-Eye, Mithril Coat, Giver of Runes, The Theorist
# (a four-mana planeswalker that only draws), Tymna the Weaver and Sapphire Medallion (none makes mana or finds a Dragon by itself);
# Dragonspeaker Shaman is in it (a three-mana body that makes the first Dragon cheaper) and so is Hellkite Courser.
# Garth line: Commander Spellbook variant 1171-1235-3908-4772 (not written on the line: the plan test checks `spellbook`
# against `pieces`, and a catalogue combo has none).
deck = "urdragon"
default = "plan"
engines = ["Rhystic Study", "The One Ring", "Niv-Mizzet, the Firemind"]
engines_ahead = ["Rhystic Study", "The One Ring"]

# The deck wins in combat with hasty fliers: the pool's attack (0.6) a little higher, caution as the pool's.
[style]
temp = 1.0
aggression = 0.7
caution = 0.5

# The Ur-Dragon is nine mana (Eminence makes the OTHER Dragon spells cost {1} less while it is in the command zone or on
# the battlefield). Its card code already rates it 85; the cost gates the cast, so only the priority is set.
[commander]
prio = 88

[key_cards]
"Terror of the Peaks" = 80
"Dragonlord Dromoka" = 72

# The second win line: all four pieces, any order (the catalogue combo `ready`s itself).
[[line]]
name = "Garth One-Eye + Spark Double + Twinflame + Doubling Season"
kind = "combo"
combo = "Garth One-Eye + Twinflame + Spark Double + Doubling Season"

# What the tutors fetch (the guide's "What to tutor for"): the Garth pieces first once Garth and Spark Double are down or
# in hand, an engine on turns 1-3, the key Dragon at five or more mana, and a seven-drop once The Ur-Dragon is out to put
# in free. A wish row always comes before the lines, so these rows are what a tutor reads first.
[[wish]]
cards = ["Doubling Season", "Twinflame"]
when = ["have:Garth One-Eye & have:Spark Double"]
score = 84

[[wish]]
cards = ["Garth One-Eye"]
when = ["out:Doubling Season"]
score = 82

[[wish]]
cards = ["Rhystic Study", "The One Ring"]
when = ["turn<=3"]
score = 80

[[wish]]
cards = ["Terror of the Peaks", "Goldspan Dragon"]
when = ["lands+mana-perms>=5"]
score = 78

[[wish]]
cards = ["Utvara Hellkite"]
when = ["commander-out"]
score = 76

# PROVISIONAL (2026-11-23, no sim yet): Urza's Incubator (names Dragon: Dragon spells cost {2} less) early, before the big
# Dragons it discounts; Demonic and Vampiric Tutor can fetch it, Worldly Tutor cannot (an artifact). Hellkite Courser
# (five mana with The Ur-Dragon in the command zone, Eminence takes one off, three with Urza's Incubator naming Dragon:
# puts The Ur-Dragon onto the battlefield with haste, back to the command zone at the end step) while the
# commander is still in the command zone and five mana is there; all three tutors can fetch it (a creature). Both sit below
# the Garth rows above, which always come first. (The Courser rows came back on 2026-11-24 with the speed package.)
[[wish]]
cards = ["Urza's Incubator"]
when = ["turn<=4 & not out:Urza's Incubator"]
score = 74

[[wish]]
cards = ["Hellkite Courser"]
when = ["commander-zone & lands+mana-perms>=5"]
score = 72

# The damage engines (each Dragon entering or attacking is a burst), the draw engines, and the Treasure and ping Dragons.
# Ramp keeps its generic rating (Sol Ring and Mana Vault 88, the dorks and rocks 85 through turn 5, Three Visits farseek_prio):
# a flat row here would only lower late ramp. Terror and Dromoka are key_cards (a key card skips every rule below). The One
# Ring keeps its generic rating (it reads the life total) once life is low; Rhystic Study's 78 replaces its tithe rating.
[[prio]]
cards = ["Scourge of Valkas", "Dragon Tempest"]
value = 78

[[prio]]
cards = ["Rhystic Study"]
when = ["turn<=6"]
value = 78
else = 62

[[prio]]
cards = ["The One Ring"]
when = ["turn<=6 & life>10"]
value = 78

[[prio]]
cards = ["Ganax, Astral Hunter", "Niv-Mizzet, the Firemind"]
value = 66

# Kyodai, Soul of Kamigawa ({3}{W}, a 3/3 flash flier, a Dragon Spirit): a cheap Dragon (Eminence takes one off, Urza's Incubator two more),
# so every Dragon payoff in the deck sees him enter (Terror of the Peaks, Scourge of Valkas, Dragon Tempest, Miirym), and the guide
# holds him for an opponent's end step or in response to a destroy effect on a key permanent. The plan language has no end-step
# or response atom, so this row only rates him as a plain 60 (the Arzakon plan rated him 60 in the 99), below Ganax and Niv-Mizzet.
# PROVISIONAL (2026-11-23, no sim yet): not a paired test; whether the AI casts him at an end step is unchecked.
[[prio]]
cards = ["Kyodai, Soul of Kamigawa"]
value = 60

# PROVISIONAL (2026-11-23, no sim yet; neither is in a paired test). Urza's Incubator ({3}, names Dragon) goes down early,
# before the big Dragons it discounts (the plan cannot say "a Dragon is in hand", so it is cast on rating alone). Sylvan Library
# ({1}{G}) is a cheap draw engine, like Rhystic Study. Hellkite Courser ({4}{R}{R}, five mana with Eminence) is a bridge: while
# The Ur-Dragon is still in the command zone it puts it onto the battlefield with haste to attack from turn 5-6 (Dragons attacking draw cards);
# with the commander already out it is only a 6/5 flier, so it ranks with the plain Dragons. Dragonspeaker Shaman ({1}{R}{R}, Dragon spells
# cost {2} less) is cast on rating alone early, like Urza's Incubator: the plan cannot say "a Dragon is in hand", and after turn 6 the discount
# matters less, so it drops to 40.
[[prio]]
cards = ["Urza's Incubator"]
when = ["turn<=6"]
value = 72
else = 40

[[prio]]
cards = ["Sylvan Library"]
when = ["turn<=6"]
value = 64
else = 50

[[prio]]
cards = ["Hellkite Courser"]
when = ["commander-zone & lands+mana-perms>=5"]
value = 70
else = 58

# PROVISIONAL (2026-11-24, no sim yet; not in a paired test): the early body that makes the first Dragons cheaper.
[[prio]]
cards = ["Dragonspeaker Shaman"]
when = ["turn<=6"]
value = 72
else = 40

# The guide's keep rule: 2-5 lands (one land only with Sol Ring, Mana Vault or two dorks), three mana by turn 3, an action
# card, and not a hand of only seven-drops. `tries` is always 0 for this deck (the settle rule is Tier 6 only), so every
# redraw reads the same 7-card rows.
[sets]
fastmana = ["Sol Ring", "Mana Vault"]
visits = ["Three Visits"]
tomb = ["Ancient Tomb"]
dorks = ["Birds of Paradise", "Llanowar Elves", "Elvish Mystic", "Delighted Halfling"]
bigs = ["Old Gnawbone", "Tiamat", "Morophon, the Boundless", "Smaug the Impenetrable",
    "Utvara Hellkite", "Summon: Bahamut"]
plays = ["Sol Ring", "Mana Vault", "Arcane Signet", "Talisman of Hierarchy", "Talisman of Curiosity", "Birds of Paradise", "Llanowar Elves", "Elvish Mystic",
    "Delighted Halfling", "Relic of Sauron", "Nature's Lore", "Rivaz of the Claw", "Scion of Draco", "Three Visits", "Demonic Tutor", "Vampiric Tutor", "Worldly Tutor", "Rhystic Study",
    "The One Ring", "Terror of the Peaks", "Goldspan Dragon", "Glorybringer", "Thundermaw Hellkite",
    "Scourge of Valkas", "Smaug the Magnificent", "Nicol Bolas, the Ravager",
    "Ganax, Astral Hunter", "Kura, the Boundless Sky", "Dragonlord Ojutai", "Kyodai, Soul of Kamigawa", "Dragon Tempest",
    "Lathliss, Dragon Queen", "Miirym, Sentinel Wyrm", "Dragonlord Dromoka",
    "Hellkite Tyrant", "Niv-Mizzet, the Firemind", "Hellkite Courser", "Sylvan Library", "Dragonspeaker Shaman"]

[mulligan]
[[mulligan.rule]]
when = ["hand-lands>=6"]
keep = false

[[mulligan.rule]]
when = ["hand-lands=0"]
keep = false

[[mulligan.rule]]
when = ["hand-lands=1 & hand:fastmana=0 & hand:dorks<=1"]
keep = false

# a lone Ancient Tomb makes no coloured mana (the guide's hand 2), and a lone land with dorks that its colours can't cast
[[mulligan.rule]]
when = ["hand-lands=1 & hand:tomb>=1"]
keep = false

[[mulligan.rule]]
when = ["hand-lands<=1 & hand-gaps:dorks>=1"]
keep = false

# a hand of only seven-drops goes back, even with mana (the `plays` row below would also send it back)
[[mulligan.rule]]
when = ["hand:bigs>=1 & nonland - hand:bigs<=0"]
keep = false

# three mana by turn 3 (a one-lander got through the rule above with its Sol Ring, Mana Vault or two dorks)
[[mulligan.rule]]
when = ["hand-lands>=2 & hand-lands+makers+hand:visits+hand:tomb<3"]
keep = false

# nothing to do: no ramp spell, tutor, engine or Dragon that comes down by turn 5
[[mulligan.rule]]
when = ["hand:plays=0"]
keep = false
