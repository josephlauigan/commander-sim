# JD's The Ur-Dragon deck (decklists/JD/ur-dragon-dragon-copies.md): five-colour Dragon entries, copies and attack
# payoffs. The card hooks model Eminence, Dragon entry triggers, token engines and the commander's attack trigger; this
# plan tells the generic pilot to ramp first, establish one multiplier or damage engine, and then deploy Dragons. Three
# infinite combos are in the catalogue (impls/t45_urdragon_combos.rs); the lines below name them for the tutors.
deck = "urdragon"
default = "plan"
engines = ["Dragon Tempest", "Dragon's Hoard", "Garruk's Uprising", "Temur Ascendancy", "Rhystic Study",
    "Sylvan Library", "The One Ring", "Smothering Tithe", "Doubling Season", "Maskwood Nexus"]

# a Dragon board that wins by attacking: more aggression than the Godo build (0.65), and more caution (was 0.45, low
# so it tapped out for Godo) since no combo turn needs everything tapped
[style]
temp = 1.0
aggression = 0.72
caution = 0.52

# Eminence supplies value without casting the commander. Cast the nine-drop after the Dragon board can attack or
# Lightning Greaves can give it haste, rather than holding back the deck's mid-game development for it.
[commander]
prio = 58
turn = 6

[key_cards]
"Miirym, Sentinel Wyrm" = 82
"Ganax, Astral Hunter" = 76
"Lathliss, Dragon Queen" = 76
"Terror of the Peaks" = 78
"Scourge of Valkas" = 74
"Utvara Hellkite" = 76
"Dragonlord Dromoka" = 72
"Scion of the Ur-Dragon" = 70

# The three infinite combos (Commander Spellbook, impls/t45_urdragon_combos.rs), best first: the tutors hunt the first
# missing piece of the closest one. Astral Dragon + Cursed Mirror is two cards and wins at once with hasty Dragons;
# Miirym + Astral Dragon + Doubling Season is three cards that fill the board (it kills the next combat); the Garth
# line needs four pieces, two of them on the battlefield already.
[[line]]
name = "Astral Dragon + Cursed Mirror"
combo = "Astral Dragon + Cursed Mirror"

[[line]]
name = "Miirym + Astral Dragon + Doubling Season"
combo = "Miirym + Astral Dragon + Doubling Season"

[[line]]
name = "Garth One-Eye + Twinflame + Spark Double + Doubling Season"
combo = "Garth One-Eye + Twinflame + Spark Double + Doubling Season"

# The rest are value packages rather than deterministic combos. Each line gives creature and unrestricted tutors a
# board-aware route toward mana, multiplication or an entry-damage finish.
[[line]]
name = "Dragon entry damage"
kind = "combat"
pieces = [["Dragon Tempest", "Scourge of Valkas", "Terror of the Peaks"],
    ["Miirym, Sentinel Wyrm", "Lathliss, Dragon Queen", "Utvara Hellkite"]]

[[line]]
name = "Dragon copies"
kind = "value"
pieces = [["Miirym, Sentinel Wyrm"], ["Astral Dragon", "Spark Double", "Cursed Mirror", "Jaxis, the Troublemaker"]]

[[line]]
name = "Dragon mana"
kind = "value"
pieces = [["Ganax, Astral Hunter", "Dragon's Hoard"], ["Ancient Copper Dragon", "Goldspan Dragon"]]

# Early tutors should make the hand functional before chasing the highest-ceiling six- and seven-drops.
[[wish]]
cards = ["Ganax, Astral Hunter", "Dragon's Hoard"]
when = ["lands+rocks<=4 & turn<=5"]
score = 90

[[wish]]
cards = ["Miirym, Sentinel Wyrm", "Lathliss, Dragon Queen"]
when = ["turn>=4"]
score = 82

[[wish]]
cards = ["Dragon Tempest", "Terror of the Peaks", "Scourge of Valkas"]
when = ["creatures>=2"]
score = 78

[[wish]]
cards = ["Dragonlord Dromoka", "Scion of Draco", "Utvara Hellkite", "Ancient Copper Dragon"]
score = 60

# Acceleration and fixing are the first plays; setup permanents come next, followed by the Dragons they multiply.
[[prio]]
cards = ["Sol Ring", "Mana Vault", "Grim Monolith", "Chrome Mox", "Mox Diamond", "Mox Jasper", "Lotus Petal",
    "Arcane Signet", "Chromatic Lantern", "Birds of Paradise", "Llanowar Elves", "Paradise Druid",
    "Sakura-Tribe Elder", "Nature's Lore", "Rampant Growth"]
when = ["turn<=5"]
value = 82
else = 42

[[prio]]
cards = ["Dragon Tempest", "Dragon's Hoard", "Garruk's Uprising", "Temur Ascendancy", "Rhystic Study",
    "Sylvan Library", "Smothering Tithe"]
when = ["turn<=5"]
value = 72
else = 58

[[prio]]
cards = ["Ganax, Astral Hunter", "Miirym, Sentinel Wyrm", "Lathliss, Dragon Queen", "Terror of the Peaks",
    "Scourge of Valkas", "Doubling Season", "Maskwood Nexus"]
value = 74

# Astral Dragon is the combo's last piece: with the Mirror (or Miirym and Doubling Season) already out it is cast at
# once; otherwise it keeps the generic value. The Mirror goes out ahead of the Dragon that follows it.
[[prio]]
cards = ["Astral Dragon"]
when = ["out:Cursed Mirror", "out:Miirym, Sentinel Wyrm & out:Doubling Season"]
value = 92

[[prio]]
cards = ["Cursed Mirror"]
when = ["have:Astral Dragon"]
value = 80

[[prio]]
cards = ["Dragonlord Dromoka", "Ancient Copper Dragon", "Utvara Hellkite", "Scion of Draco",
    "Scion of the Ur-Dragon"]
value = 68

[[hold]]
card = "Teferi's Protection"
protects = ["commander", "Miirym, Sentinel Wyrm", "Lathliss, Dragon Queen", "Terror of the Peaks"]

# Keep a functional mana hand; unlike the former Godo build, no specific two-card line is required.
[mulligan]
lands = [2, 5]
pieces = 0
