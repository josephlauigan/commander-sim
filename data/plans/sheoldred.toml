# Deck plan (Phase 4, audit/phase4/plans-design.md). Read by rust/crates/sim-core/src/ai/plan_data.rs and the generic
# policy (ai/plans.rs `config`). JD's Sheoldred, the Apocalypse deck (mono-B draw punisher, key `sheoldred`, tiers
# t3-t4). Written in Phase 4 PR 7 from its hand AI, played when AI_HAND is off: `sheoldred::sheoldred_prio` and
# `pkg2_prio` (the prio rules, rescaled under 90), `sheoldred_protect` / `sheoldred_hold` (the holds).
# No lines: the hand AI has no tutor wish list (its tutors take the highest-priority card, which the prio rules give).
# 2026-11-01 (audit/sheoldred/plan-file-2026-11-01.md): the card plays the hand AI gated on the deck (`plays`: the X
# drain, Dark Deal, Peer into the Abyss, the Atlas, Geier Reach Sanitarium and Mikokoro), Ad Nauseam in her second
# main phase (`knobs.adnaus_main2`), and Darksteel Plate on Sheoldred ahead of the other plays (`[equip]`: was
# `sheoldred_special`'s equip).
# Left out (the schema can't express it): Phyrexian Delver's reanimation target, Soul Enervation's kill check, the
# Memory Jar / Necrosquito / Rooftop Assassin / Seizan rules; the Beckoner's warp (`sheoldred_special`) and Seizan
# taking the Helm; Toxic Deluge's cap (`deluge_cap`); the hold's value by removal risk and the hexproof check.
deck = "sheoldred"
default = "plan"
# the card plays her hand AI made through card code (Exsanguinate's main-phase X cast, Dark Deal, Peer into the Abyss,
# the Atlas, the draw lands), which the generic policy offers for this deck too
plays = [
    "Exsanguinate",
    "Dark Deal",
    "Peer into the Abyss",
    "Otherworld Atlas",
    "Geier Reach Sanitarium",
    "Mikokoro, Center of the Sea",
]

# Sheoldred as early as the mana allows
[commander]
prio = 90

# she taps out on her own turn: Ad Nauseam also in her second main phase (was the sheoldred arm of adnaus_cast_now)
[knobs]
adnaus_main2 = true

# Cast priorities (was sheoldred_prio): rocks first while she is not out (she comes a turn sooner); the draw tolls
# (Underworld Dreams, Fate Unraveler) high; Howling Mine only with a toll out; Darksteel Plate onto her; the
# protection instants held (cast by the protect hook)
[[prio]]
cards = ["Arcane Signet", "Fellwar Stone"]
when = ["not commander-out"]
value = 88

[[prio]]
cards = ["Underworld Dreams"]
value = 86

[[prio]]
cards = ["Fate Unraveler"]
value = 84

[[prio]]
cards = ["Howling Mine"]
when = ["commander-out", "out:Underworld Dreams", "out:Fate Unraveler"]
value = 70
else = 0

[[prio]]
cards = ["Darksteel Plate"]
when = ["commander-out"]
value = 78

[[prio]]
cards = ["Battle-Rage Blessing"]
value = 0

[[prio]]
cards = ["Perigee Beckoner"]
value = 52

[[prio]]
cards = ["Ambition's Cost"]
when = ["life<=6"]
value = 0

# indestructible for Sheoldred against destroy / damage removal; mana kept up while she is out
[[hold]]
card = "Battle-Rage Blessing"
protects = ["commander"]
mana = true

# --- 2026-11-01: Darksteel Plate onto Sheoldred ahead of every other play of the turn (was sheoldred_special: utility
# 9 - 0.1 x the cost; here 2.5 - 0.3 x 2 + 7)
[equip]
holder = "commander"
utility = 7.0
