# JD's Arzakon Cali Commander artifact-combo deck (decklists/cali_commander/arzakon-artifact-combo.md, key
# `arzakon`, `kyodai` until 2026-11-23, `thanos` until 2026-11-22; rewritten 2026-11-13 for the Cali list that replaced the artifacts-and-Dragons list; 2026-11-24: Rhystic Study out and Sunpearl Kirin in, so Rhystic Study is removed from the rows below and the Kirin has no row). `arzakon` is not a Tier
# 6 key (the `thrasios` key took the Tier 6 rules), so the generic pool policy reads this file: `[style]`, `[commander]`,
# `[key_cards]`, `[[line]]`, `[[wish]]`, `[[prio]]`, `[[hold]]` and `[mulligan]`. The plan: fast mana and Arzakon first,
# the engines (The One Ring, Mystic Remora, Urza, Crucible), then Basalt Monolith + Rings of Brighthearth
# into Walking Ballista. Arzakon is the commander (a five-colour planeswalker, {W}{U}{B}{R}{G}, so it needs all five colours and has no flash body),
# Kyodai, Soul of Kamigawa left the list on 2026-11-23 (his card code, impls/kyodai.rs, stays in the engine). Leyline of the Guildpact
# (engine/chars.rs, impls/card_models.rs) is card code; the plan only values it, by the Faeburrow Elder. The old commander's card code
# (impls/t6_thanos.rs) stays in the engine.
# PROVISIONAL: the style numbers, priorities and keep rule come from the pilot guide in the deck document, not from a
# paired test (no sims yet). Left out until the engine models them: Tinker into Blightsteel Colossus, Sneak Attack,
# Staff of Domination + Faeburrow Elder, Thassa's Oracle with Demonic Consultation or Tainted Pact, and Tezzeret, Cruel
# Captain (the plan has no lines for them), and the 1v1, 30-life Cali rules themselves. The commander value
# below is provisional (Opus design consult 2026-11-23), not tuned.
deck = "arzakon"
default = "plan"
engines = ["The One Ring", "Mystic Remora", "Urza, Lord High Artificer", "Crucible of Worlds"]

# The deck plans to have its commander down on turn 3 and then play value, not a goldfish combo: pool defaults for temperature, a little
# above the pool's attack, less caution than the pool's 0.5 only while ahead on mana.
[style]
temp = 1.0
aggression = 0.6
caution = 0.5

# Arzakon, a five-colour planeswalker ({W}{U}{B}{R}{G}, loyalty 4: +2 three damage, -3 a Black Lotus token, -7 wheel),
# sorcery speed. It needs all five colours, so it comes down on turn 3 only off fast mana and a fixed mana base, and it is
# the deck's commander.
# PROVISIONAL: prio 74, turn 3 (Opus design consult 2026-11-23, item 10), not tuned by any sim.
[commander]
prio = 74
turn = 3

[key_cards]
"Walking Ballista" = 70
"Urza, Lord High Artificer" = 74

# Win line: Basalt Monolith + Rings is two cards and then any mana sink: Walking Ballista from hand (a huge X), Staff of
# Domination on the battlefield (draw to the Ballista) or Urza (the whole library).
[[line]]
name = "Basalt Monolith + Rings of Brighthearth + a mana sink"
kind = "combo"
pieces = [["Basalt Monolith"], ["Rings of Brighthearth"], ["Walking Ballista", "Staff of Domination", "Urza, Lord High Artificer"]]

# What the tutors fetch (the guide's "What to tutor for"): the combo's missing piece first, an engine on turns 2-3 when
# nothing is going, Meteor Golem or the Rings when the board can't be beaten.
[[wish]]
cards = ["Basalt Monolith", "Rings of Brighthearth"]
when = ["lands+rocks>=3"]
score = 90

[[wish]]
cards = ["Staff of Domination", "Walking Ballista"]
when = ["out:Basalt Monolith & out:Rings of Brighthearth"]
score = 95

[[wish]]
cards = ["The One Ring"]
when = ["turn<=3"]
score = 80

[[wish]]
cards = ["Meteor Golem"]
when = ["opp-power>=15"]
score = 76

# Acceleration and fixing are the first plays; Arzakon and the engines next; the big top end last.
[[prio]]
cards = ["Sol Ring", "Mana Crypt", "Mana Vault", "Lotus Petal", "Arcane Signet", "Birds of Paradise",
    "Paradise Druid", "Talisman of Progress",
    "Mox Opal", "Chrome Mox", "Fellwar Stone"]
when = ["turn<=4"]
value = 86
else = 46

# No [[prio]] row for Dockside Extortionist ({1}{R}, 1/2): it makes one Treasure for each artifact and enchantment the one
# opponent controls (Cali is 1v1), so 0 to 2 on turn 2 and more later. A plan row would override the card's own priority
# (impls/dockside.rs: 0 while the opponent has no artifact or enchantment, so the AI holds it; 52 to 77 from one up), and a
# plan row cannot say "the opponent has an artifact". It needs a red source.
# PROVISIONAL (2026-11-23): the card's values are a guess, not simulated.

[[prio]]
cards = ["The One Ring", "Mystic Remora"]
when = ["turn<=6"]
value = 78
else = 62

[[prio]]
cards = ["Urza, Lord High Artificer", "Crucible of Worlds", "Chromatic Lantern"]
value = 74

# Leyline of the Guildpact does nothing alone: it makes the Faeburrow Elder tap for all five colours and every land tap for any
# colour, so cast it when the Elder is out or in hand (it is free from the opening hand: the engine plays it on the battlefield then)
[[prio]]
cards = ["Leyline of the Guildpact"]
when = ["have:Faeburrow Elder", "out:Faeburrow Elder"]
value = 76
else = 48

# The combo pieces: Basalt Monolith first, Rings once it is held (or out); the Ballista is the kill, not a body
[[prio]]
cards = ["Basalt Monolith"]
value = 82

[[prio]]
cards = ["Rings of Brighthearth"]
when = ["have:Basalt Monolith", "out:Basalt Monolith"]
value = 80
else = 44

[[prio]]
cards = ["Walking Ballista"]
when = ["have:Basalt Monolith & have:Rings of Brighthearth & lands<8", "out:Basalt Monolith & have:Rings of Brighthearth & lands<8"]
value = 0

[[prio]]
cards = ["Walking Ballista"]
when = ["lands>=6"]
value = 56
else = 40

[[prio]]
cards = ["Hangarback Walker", "Primeval Titan"]
value = 68

# No row for Karn Liberated ({7}, in since 2026-11-23 for Kyodai): the plan has no row for Tezzeret or Karn, the Great Creator
# either, so it is left to the generic rating (not checked how that rates a seven-mana planeswalker).

# The top end: after the board is built
[[prio]]
cards = ["Meteor Golem"]
when = ["lands+rocks>=7"]
value = 66
else = 20

[[hold]]
card = "Teferi's Protection"
protects = ["commander", "The One Ring"]

# The guide's keep rule: 2-5 lands (a lone land only with three fast pieces), mana by turn 2-3, and something to do.
[sets]
tutors = ["Demonic Tutor", "Vampiric Tutor", "Enlightened Tutor", "Mystical Tutor", "Worldly Tutor", "Grim Tutor",
    "Tinker"]
engines = ["The One Ring", "Mystic Remora", "Urza, Lord High Artificer", "Crucible of Worlds"]
pieces = ["Basalt Monolith", "Rings of Brighthearth", "Walking Ballista", "Staff of Domination", "Thassa's Oracle",
    "Blightsteel Colossus"]

[mulligan]
fast_mana = true

[[mulligan.rule]]
when = ["hand-lands>=6"]
keep = false

[[mulligan.rule]]
when = ["hand-lands=0"]
keep = false

[[mulligan.rule]]
when = ["hand-lands=1 & fast<3"]
keep = false

# nothing to do: no tutor, engine or combo piece
[[mulligan.rule]]
when = ["hand:tutors=0 & hand:engines=0 & hand:pieces=0"]
keep = false

[[mulligan.rule]]
when = ["mana<2"]
keep = false
