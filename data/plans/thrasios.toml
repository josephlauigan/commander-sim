# Deck plan (Phase 4, audit/phase4/plans-design.md). Read by rust/crates/sim-core/src/ai/plan_data.rs and the generic
# policy (ai/plans.rs `config`). JD's Tymna the Weaver + Thrasios, Triton Hero deck (key `thrasios`, tier t6 since 2026-11-05: the
# Doomsday rebuild, decklists/JD/tymna-thrasios-doomsday.md; the Doomsday line was added 2026-11-05, see the Doomsday section below). Written in Phase 4 PR 7 from its hand AI, played when AI_HAND is off: `tymna_partners::
# partner_prio` / `combo_prio` (the prio rules), `combo_piece` / `tymna_cards::tutor_pick` (the line),
# `protection_held` (no hold now: Blossoming Defense left 2026-11-02). The line is the catalogue's "Power Artifact /
# Rings of Brighthearth + Monolith" as this deck plays it: the outlet is Walking Ballista or Thrasios on the
# battlefield (`combo_piece`).
# Pruned 2026-11-05 for the new list: Bastion Protector, Faeburrow Elder and Talisman of Curiosity left the deck, so
# their rules went. Left out (the schema can't express it): the tutor's other branches (a land below five lands, a sweeper when behind
# on board, a finisher when ahead, the cheapest evasive creature); the evasive-creature rule's count against the
# opponents (approximated by the creatures out); Ballista's mana gates (approximated by the lands); Baird's and
# Lagrella's board reads; the attack spread, `commander_first`, `thrasios_sink`, the combat tricks and Ballista's
# counter targets.
deck = "thrasios"
default = "plan"

# Tier 6 (JD, 2026-11-05: `thrasios` is a Tier 6 key, so the plan slots read this file). The style, the Oracle line, the tutor
# sets and the keep rule below are the old Thanos turbo plan (data/plans/thanos.toml before 2026-11-05) cut to the cards
# this list still plays; PROVISIONAL like it was (no sim has run on this list yet). The Doomsday line (the pile builder, its
# cast and the play of the pile are code, impls/doomsday.rs; this file holds its tutor wishes, the go-now gate, the held prio and the keep terms) is in the Doomsday section at the end.
[style]
temp = 1.0
aggression = 0.6
caution = 0.35

# win lines: the tutors want the first missing piece
[[line]]
name = "Thassa's Oracle + Demonic Consultation / Tainted Pact"
combo = "Thassa's Oracle + Demonic Consultation / Tainted Pact"

[[line]]
name = "Basalt Monolith + Rings of Brighthearth + a mana sink"
kind = "combo"
pieces = [["Basalt Monolith"], ["Rings of Brighthearth"], ["Walking Ballista", "bf:Thrasios, Triton Hero"]]

# Cast priorities (was partner_prio): Tymna as soon as she can be cast, Thrasios turn 2 (3 less per tax); one-mana
# ramp, then two-mana ramp (early turns); the combo pieces; cheap evasive creatures for Tymna's draw
[[prio]]
cards = ["Tymna the Weaver"]
value = 90
per_tax = -3

[[prio]]
cards = ["Thrasios, Triton Hero"]
value = 86
per_tax = -3

[[prio]]
cards = ["Avacyn's Pilgrim", "Birds of Paradise"]
when = ["turn<=5"]
value = 89

[[prio]]
cards = ["Sol Ring", "Arcane Signet"]
when = ["turn<=3"]
value = 87

[[prio]]
cards = ["Sol Ring", "Arcane Signet"]
when = ["turn<=5"]
value = 83

[[prio]]
cards = ["Basalt Monolith"]
when = ["turn<=5"]
value = 82
else = 74

[[prio]]
cards = ["Rings of Brighthearth"]
when = ["have:Basalt Monolith"]
value = 72
else = 38

# the Ballista is the kill once Basalt and Rings are held: not cast as a body
[[prio]]
cards = ["Walking Ballista"]
when = ["have:Basalt Monolith & have:Rings of Brighthearth & lands<8"]
value = 0

[[prio]]
cards = ["Walking Ballista"]
when = ["lands>=6"]
value = 56

[[prio]]
cards = ["Walking Ballista"]
when = ["lands>=4"]
value = 50
else = 0

[[prio]]
creature = true
flying = true
max_mv = 4
when = ["creatures<3"]
value = 78
else = 66

# Lion's Eye Diamond ({0}) is cast only with Doomsday (or a tutor that can fetch it) in hand: on the table it is a mana source for the
# Doomsday cast and the pile (cracked while the spell is on the stack: `doomsday::go_doomsday`, `Act::led`), and alone it is
# a card that discards the hand, so it waits (`mine::led_options` offers a bare crack only for a use)
[[prio]]
cards = ["Lion's Eye Diamond"]
when = ["hand:led_fuel>=1"]
value = 90
else = 0

# ---- Tier 6 sections (from the old Thanos turbo plan, cut to this list) ----
[sets]
tutors = ["Demonic Tutor", "Vampiric Tutor", "Mystical Tutor", "Enlightened Tutor", "Worldly Tutor", "Imperial Seal", "Diabolic Intent", "Grim Tutor", "Merchant Scroll", "Eladamri's Call", "Beseech the Mirror", "Intuition", "Demonic Consultation", "Tainted Pact"]
payoffs = ["Necropotence", "Ad Nauseam"]
exilers = ["Demonic Consultation", "Tainted Pact"]
enablers = ["Valley Floodcaller", "Borne Upon a Wind"]
# what Lion's Eye Diamond fuels in this list: Doomsday (it pays the {B}{B}{B} and the discarded hand goes to the graveyard, where
# Doomsday can take it into the pile; `impls/doomsday.rs`), and the tutors that can fetch it
led_fuel = ["Doomsday", "Demonic Tutor", "Vampiric Tutor", "Mystical Tutor", "Imperial Seal", "Grim Tutor", "Diabolic Intent", "Beseech the Mirror", "Intuition"]
locks = ["Silence", "Grand Abolisher", "Voice of Victory"]
# an engine alone does not win: it counts as action only with fast mana
engines = ["Rhystic Study", "Mystic Remora", "Esper Sentinel", "Sylvan Library"]
# a tutor, a payoff or the Oracle
action = ["Demonic Tutor", "Vampiric Tutor", "Mystical Tutor", "Enlightened Tutor", "Worldly Tutor", "Imperial Seal", "Diabolic Intent", "Grim Tutor", "Merchant Scroll", "Eladamri's Call", "Beseech the Mirror", "Intuition", "Demonic Consultation", "Tainted Pact", "Necropotence", "Ad Nauseam", "Thassa's Oracle", "Doomsday", "Gitaxian Probe", "Brainstorm", "Ponder", "Preordain", "Borne Upon a Wind"]

# Fast mana and a plan beat land count: `fast` = the hand's mana pieces that count by turn 2 plus its rituals, `mana`
# = what the hand makes by turn 2 plus its rituals (t6_keep::mana). A settled hand (2-4 lands after a mulligan) is kept.
[mulligan]
fast_mana = true
rituals = ["Dark Ritual", "Cabal Ritual", "Elvish Spirit Guide"]

[[mulligan.rule]]
when = ["hand-lands>=6"]
keep = false

[[mulligan.rule]]
when = ["hand-lands=0 & fast>=3 & hand:tutors>=1", "hand-lands=0 & fast>=3 & hand:payoffs>=1"]
keep = true

[[mulligan.rule]]
when = ["hand-lands=0"]
keep = false

[[mulligan.rule]]
when = ["hand-lands=1 & mana<one-lander", "hand-lands=1 & hand:action=0 & hand:engines=0", "hand-lands=1 & hand:action=0 & fast<1"]
keep = false

[[mulligan.rule]]
when = ["mana<2", "hand:action=0 & hand:engines=0 & fast<2", "hand:action=0 & fast<1"]
keep = false

[[mulligan.rule]]
when = ["hand-lands>=5 & fast=0 & hand:action<2"]
keep = false

# ---- Doomsday (2026-11-05; the pile builder, the cast timing and the play of the pile are code: impls/doomsday.rs) ----
# PROVISIONAL, like the rest of the Tier 6 sections: nothing here has been simulated.
# What the schema can't say, and the code does: which five cards (an exact search over Piles A, B, C and the devotion-3
# variants), the cast at the end step of the turn before (the card's `hand_options`: Teferi +1 / Valley Floodcaller /
# Borne Upon a Wind), Brainstorm's put-back and Preordain / Ponder / Probe inside the pile.
[[line]]
name = "Doomsday + Thassa's Oracle"
combo = "Doomsday + Thassa's Oracle"

# held: the card's own options cast it (a plain cast priority would cast it as a sorcery whenever the mana is there)
[[prio]]
cards = ["Doomsday"]
value = 0

# the pile is played once Doomsday has resolved: the table's "can it be stopped" check does not apply to the rest of it
[[go_now]]
combos = ["Doomsday + Thassa's Oracle"]
go = true

# tutors: Doomsday is the exile half in effect (the guide's tutor table): wanted with Oracle held and no Consultation or
# Pact, when a flash enabler is out or in hand
[[wish]]
cards = ["Doomsday"]
when = ["hand:exilers=0 & have:Thassa's Oracle & (hand:enablers>=1 | out:Valley Floodcaller | out:Teferi, Time Raveler)"]
score = 2.5

# the lock beats a spare piece when the line is held (the guide: one lock wins more games than a spare combo piece)
[[wish]]
cards = ["Silence"]
when = ["have:Thassa's Oracle & (hand:exilers>=1 | have:Doomsday) & hand:locks=0"]
score = 1.5

# the pile's own cards when Doomsday and Oracle are held
[[wish]]
cards = ["Gitaxian Probe", "Preordain", "Ponder", "Brainstorm"]
when = ["have:Doomsday & have:Thassa's Oracle"]
score = 1.0

# Keep rule, colours (the guide's keep table: "A hand with no coloured source for its spells goes back even if the count
# passes"; hand 4: "Lots of mana, but none of it coloured: Ad Nauseam needs {B}{B}, Doomsday {B}{B}{B}"). `hand-castable:action`
# counts the hand's action cards that have a source of every colour they need (impls/t6_keep.rs `hand_sources`: the hand's
# lands, a fetch land for the colours of the lands left in the library, and the rocks and dorks the hand can cast; a
# Dark Ritual or a Sol Ring makes no colour alone). A hand with action cards and none it can cast in colour goes back.
# This replaces the Doomsday-only term (`have:Doomsday & hand-b-lands=0 & hand:action<=1`; the quantity `hand-b-lands`
# still parses). It runs after the shared rules above it, so it only adds a mulligan, and a settled hand (a mulligan
# hand with 2-4 lands) never reaches it.
[[mulligan.rule]]
when = ["hand:action>=1 & hand-castable:action=0"]
keep = false
