# Deck plan (Phase 4, audit/phase4/plans-design.md). Read by rust/crates/sim-core/src/ai/plan_data.rs and the generic
# policy (ai/plans.rs `config`). JD's Y'shtola, Night's Blessed deck (Esper: each noncreature spell of mana value 3+
# drains the table for 2; Sanguine Bond and Marauding Blight-Priest turn the life gained into more drain; stax and
# pillowfort hold the table; Exsanguinate / Debt to the Deathless finish). Written in Phase 4 PR 7 from its hand AI,
# which runs when AI_HAND is on: impls/yshtola.rs `yshtola_prio` / `yshtola_named_prio` (cast priorities),
# `tutor_pick` (the tutor wish list) and `yshtola_protect` (with zur::zur_protect: Restoration Angel; Teferi's
# Protection before a wipe).
# 2026-11-01 (audit/yshtola/plan-file-2026-11-01.md): the X drains' main-phase cast (`plays`: was `x_option`, gated
# on the hand AI), Champion's Helm on Y'shtola (`[equip]`: was `yshtola::helm`), her cast trigger's value on the MV 3+
# noncreature spells (`[[prio_add]]`: was `trigger_bonus`, two steps here), and she chumps only to live (the knob: was
# the combat.rs chump rule).
# Left out (the schema can't express it): `trigger_bonus` exactly (by the opponents alive, Curiosity, a kill in
# range, the fourth-life draw) and in the removal and wipe utilities; the lethal test for the X drains in
# `tutor_pick` (the X drains are wished for last here); the Zur lock targets; Hostage Taker / Skyclave / Massacre
# Wurm / Prayer of Binding target values; Necropotence / Sphinx / Tithe / One Ring helpers (generic priority); the
# removal-target rules in brain.rs (`removal_adjust`, no sampling far below the best target); the wipe swing with
# Teferi's Protection held up (`teferis_first`).
deck = "yshtola"
default = "plan"
# card engines the tutors want once no line wants a card
engines = ["Sanguine Bond", "Rhystic Study", "Necropotence"]
# the X drains are cast by their own main-phase play (yshtola::x_drain_option: for a kill, or a big X late), which the
# generic policy offers for this deck too
plays = ["Exsanguinate", "Debt to the Deathless"]

# Y'shtola costs four: cast her from turn 2 on, over everything
[commander]
prio = 90
turn = 2

# win lines, best first
[[line]]
name = "Y'shtola + Sanguine Bond / Marauding Blight-Priest (every drain drains again)"
kind = "drain"
pieces = [["Y'shtola, Night's Blessed"], ["Sanguine Bond", "Marauding Blight-Priest"]]

# Tutor wishes (yshtola::tutor_pick), best score first, ahead of the lines' pieces
# Greaves for a Y'shtola that keeps getting removed (tax 4+, not on the battlefield or in the command zone)
[[wish]]
cards = ["Lightning Greaves"]
when = ["not commander-out & not commander-zone & tax>=4"]
score = 90

[[wish]]
cards = ["Sanguine Bond"]
score = 85

[[wish]]
cards = ["Necropotence"]
when = ["turn<=6 & life>=25"]
score = 80

# under attack: the table's power at 12 or more
[[wish]]
cards = ["Propaganda"]
when = ["opp-power>=12 & not out:Propaganda"]
score = 75

[[wish]]
cards = ["Marauding Blight-Priest"]
score = 70

[[wish]]
cards = ["Ill-Gotten Inheritance"]
score = 60

[[wish]]
cards = ["Prison Sentence"]
score = 58

[[wish]]
cards = ["Arrest"]
score = 56

[[wish]]
cards = ["Propaganda"]
score = 54

# the X drains last (the hand AI moves them first once the table is in range of X: not expressible)
[[wish]]
cards = ["Exsanguinate", "Debt to the Deathless"]
score = 50

# Cast priorities (yshtola_named_prio), the first rule selecting a card decides
[[prio]]
commander = true
when = ["turn>=2"]
value = 90
else = 60

[[prio]]
cards = ["Sol Ring", "Arcane Signet", "Chromatic Lantern", "Coalition Relic", "Talisman of Progress"]
when = ["turn<=5"]
value = 82
else = 30

[[prio]]
cards = ["Sanguine Bond"]
value = 76

# Propaganda: one is enough; sooner when the table hits hard
[[prio]]
cards = ["Propaganda"]
when = ["out:Propaganda"]
value = 30

[[prio]]
cards = ["Propaganda"]
when = ["opp-power>=12"]
value = 62
else = 44

[[prio]]
cards = ["Marauding Blight-Priest"]
value = 62

[[prio]]
cards = ["Lightning Greaves"]
when = ["commander-out"]
value = 58
else = 25

[[prio]]
cards = ["The Eternal Wanderer"]
value = 58

[[prio]]
cards = ["Polluted Bonds"]
when = ["turn<=8"]
value = 56
else = 38

[[prio]]
cards = ["Bribery"]
value = 56

[[prio]]
cards = ["Ill-Gotten Inheritance", "Zur the Enchanter"]
value = 54

[[prio]]
cards = ["Dark Petition", "Diabolic Tutor", "Idyllic Tutor", "Mystical Tutor"]
value = 52

[[prio]]
cards = ["Thief of Sanity"]
value = 52

[[prio]]
cards = ["Mystic Remora"]
when = ["turn<=4"]
value = 40
else = 8

[[prio]]
cards = ["Esper Sentinel"]
when = ["turn<=4"]
value = 46
else = 30

# the X drains have their own cast options
[[prio]]
cards = ["Exsanguinate", "Debt to the Deathless"]
value = 0

# Restoration Angel is held for flash (25): it blinks Y'shtola out of removal
[[prio]]
cards = ["Restoration Angel"]
value = 25

# protection held, not cast proactively
[[hold]]
card = "Restoration Angel"
protects = ["commander"]

[[hold]]
card = "Teferi's Protection"
protects = ["commander", "Sanguine Bond"]

# --- 2026-11-01
# she is the engine: she chump-blocks only when the attack would otherwise kill
[knobs]
commander_chumps_to_live = true

# Champion's Helm (equip {1}, card code only) goes on Y'shtola (was yshtola::helm: 2.5 + 0.3 x her value)
[equip]
holder = "commander"
utility = 1.5
extra = { "Champion's Helm" = [1, 0] }

# her cast trigger (2 to each opponent, 2 life) on a noncreature spell of mana value 3 or more, added to its priority
# while she is out (was trigger_bonus: 4 x (1.5 x 2 per opponent drain + 1 with Bond), up to 20)
[[prio_add]]
creature = false
min_mv = 3
when = ["commander-out & (out:Sanguine Bond | out:Marauding Blight-Priest)"]
value = 16

[[prio_add]]
creature = false
min_mv = 3
when = ["commander-out"]
value = 12
