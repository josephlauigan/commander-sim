# Deck plan (Phase 4, audit/phase4/plans-design.md). Read by rust/crates/sim-core/src/ai/plan_data.rs and the generic
# policy (ai/plans.rs `config`). JD's Y'shtola, Night's Blessed deck (Esper: each noncreature spell of mana value 3+
# drains the table for 2; Sanguine Bond and Marauding Blight-Priest turn the life gained into more drain; stax and
# pillowfort hold the table; Exsanguinate / Debt to the Deathless finish). Written in Phase 4 PR 7 from its hand AI,
# which runs when AI_HAND is on: impls/yshtola.rs `yshtola_prio` / `yshtola_named_prio` (cast priorities),
# `tutor_pick` (the tutor wish list) and `yshtola_protect` (with zur::zur_protect: Restoration Angel; Teferi's
# Protection before a wipe).
# 2026-11-01 (audit/yshtola/plan-file-2026-11-01.md): the X drains' main-phase cast (`plays`: was `x_option`, gated
# on the hand AI), Champion's Helm on Y'shtola (`[equip]`: was `yshtola::helm`), her cast trigger's value on the MV 3+
# noncreature spells (`[[prio_add]]`: was `trigger_bonus`, two steps here), and she chumps only to live (the knob: was
# the combat.rs chump rule).
# Left out (the schema can't express it): `trigger_bonus` exactly (by the opponents alive, Curiosity, a kill in
# range, the fourth-life draw) and in the removal and wipe utilities; the lethal test for the X drains in
# `tutor_pick` (the X drains are wished for last here); the Zur lock targets; Skyclave /
# Prayer of Binding target values; Necropotence / Sphinx / Tithe / One Ring helpers (generic priority); the
# removal-target rules in brain.rs (`removal_adjust`, no sampling far below the best target); the wipe swing with
# Teferi's Protection held up (`teferis_first`).
# 2026-11-14: Restoration Angel, Teferi's Protection (the `yshtola_protect` cards named above) and Champion's Helm (the
# `[equip]` section named above) left the list with the Doomsday package; their rules were removed from this file.
deck = "yshtola"
default = "plan"
# card engines the tutors want once no line wants a card
engines = ["Sanguine Bond", "Rhystic Study", "Necropotence"]
# the X drains are cast by their own main-phase play (yshtola::x_drain_option: for a kill, or a big X late), which the
# generic policy offers for this deck too
plays = ["Exsanguinate", "Debt to the Deathless"]

# Y'shtola costs four: cast her from turn 2 on, over everything
[commander]
prio = 90
turn = 2

# win lines, best first
[[line]]
name = "Y'shtola + Sanguine Bond / Marauding Blight-Priest (every drain drains again)"
kind = "drain"
pieces = [["Y'shtola, Night's Blessed"], ["Sanguine Bond", "Marauding Blight-Priest"]]

# Tutor wishes (yshtola::tutor_pick), best score first, ahead of the lines' pieces
[[wish]]
cards = ["Sanguine Bond"]
score = 85

[[wish]]
cards = ["Necropotence"]
when = ["turn<=6 & life>=25"]
score = 80

# under attack: the table's power at 12 or more
[[wish]]
cards = ["Propaganda"]
when = ["opp-power>=12 & not out:Propaganda"]
score = 75

[[wish]]
cards = ["Marauding Blight-Priest"]
score = 70

[[wish]]
cards = ["Palantír of Orthanc"]
score = 60

[[wish]]
cards = ["Arrest"]
score = 56

[[wish]]
cards = ["Propaganda"]
score = 54

# the X drains last (the hand AI moves them first once the table is in range of X: not expressible)
[[wish]]
cards = ["Exsanguinate", "Debt to the Deathless"]
score = 50

# Cast priorities (yshtola_named_prio), the first rule selecting a card decides
[[prio]]
commander = true
when = ["turn>=2"]
value = 90
else = 60

[[prio]]
cards = ["Sol Ring", "Arcane Signet", "Coalition Relic", "Mox Diamond", "Chrome Mox"]
when = ["turn<=5"]
value = 82
else = 30

[[prio]]
cards = ["Sanguine Bond"]
value = 76

# Propaganda: one is enough; sooner when the table hits hard
[[prio]]
cards = ["Propaganda"]
when = ["out:Propaganda"]
value = 30

[[prio]]
cards = ["Propaganda"]
when = ["opp-power>=12"]
value = 62
else = 44

[[prio]]
cards = ["Marauding Blight-Priest"]
value = 62

[[prio]]
cards = ["Polluted Bonds"]
when = ["turn<=8"]
value = 56
else = 38

[[prio]]
cards = ["Palantír of Orthanc", "Zur the Enchanter"]
value = 54

[[prio]]
cards = ["Ringsight", "Diabolic Tutor", "Mystical Tutor", "Vampiric Tutor"]
value = 52

[[prio]]
cards = ["Esper Sentinel"]
when = ["turn<=4"]
value = 46
else = 30

# the X drains have their own cast options
[[prio]]
cards = ["Exsanguinate", "Debt to the Deathless"]
value = 0

# 2026-11-14: Restoration Angel and Teferi's Protection (the two holds), Mystic Remora, Idyllic Tutor and Champion's Helm
# left the list with the Doomsday package, so their rules are gone: the deck holds no protection for Y'shtola or the wipe
# --- 2026-11-01
# she is the engine: she chump-blocks only when the attack would otherwise kill
[knobs]
commander_chumps_to_live = true

# her cast trigger (2 to each opponent, 2 life) on a noncreature spell of mana value 3 or more, added to its priority
# while she is out (was trigger_bonus: 4 x (1.5 x 2 per opponent drain + 1 with Bond), up to 20)
[[prio_add]]
creature = false
min_mv = 3
when = ["commander-out & (out:Sanguine Bond | out:Marauding Blight-Priest)"]
value = 16

[[prio_add]]
creature = false
min_mv = 3
when = ["commander-out"]
value = 12

# ---- Doomsday / Oracle package (2026-11-14, JD: Option B, 12 swaps from the Tymna/Thrasios Doomsday deck) ----
# In: Thassa's Oracle, Demonic Consultation, Doomsday, Silence, Grand Abolisher, Valley Floodcaller, Borne Upon a Wind,
# Teferi Time Raveler, Brainstorm, Preordain, Dark Ritual (Gitaxian Probe was in this package and was swapped for Sphere of
# Safety on 2026-11-14, JD: it is not in the list). NOT in: Tainted Pact (it stops at the second
# card with the same name, and this list has 19 basics, so it can't exile the library), Orim's Chant, Cabal Ritual,
# Mockingbird, Lion's Eye Diamond, Ponder (Opus review 2026-11-14; Read the Bones and Fatal Push stay in the deck).
# PROVISIONAL: nothing below has been measured. Only the generic sections are used (she is a Tier 5 key: the Tier 6 plan
# slots ([sets], [mulligan], [[go_now]]) are never read for her), so the keep rule and the lock-before-go check of the
# Tier 6 Doomsday deck do not carry over. The pile builder, its cast timing and the play of the pile are code
# (impls/doomsday.rs), not data.

# win lines: the tutors want the first missing piece. The first name is the combo catalogue's (it must match): this list
# plays Consultation only, Tainted Pact is not in it. The Doomsday line lists Doomsday on the tutor wish list whenever the
# Oracle is held, with or without a way to cast it: the wish below only ranks it higher when there is one
[[line]]
name = "Thassa's Oracle + Demonic Consultation / Tainted Pact"
combo = "Thassa's Oracle + Demonic Consultation / Tainted Pact"

[[line]]
name = "Doomsday + Thassa's Oracle"
combo = "Doomsday + Thassa's Oracle"

# held: the card's own options cast it (a plain cast priority would cast it as a sorcery whenever the mana is there)
[[prio]]
cards = ["Doomsday"]
value = 0

# Silence: no rule that casts it. The Tier 6 Doomsday deck casts the lock before the line through
# `t6_table::protect_before_go`, which a Tier 5 deck never reaches. A first stand-in (a priority rule on "the Oracle held with
# Consultation or Doomsday") was tried and removed: read from the code (Opus review 2026-11-14), the line is offered at
# utility 14 or more and Silence at priority 66 is worth about 6.6, so the AI goes first without it and the rule fires on turns
# the line cannot go, spending the deck's only Silence. So at Tier 5 the AI does not cast Silence as a lock before the Oracle + Consultation line
# (Doomsday piles still cast it inside the pile code). Explicit zero, so the intent stays visible
[[prio]]
cards = ["Silence"]
value = 0

# tutors, first the two-card line: Consultation with the Oracle held, the Oracle with Consultation held. These rank above
# Doomsday and above Sanguine Bond (85): the line wins the game and costs no life (the source guide: "with either exile half
# still in the library, tutor for it instead"). `have:` is the hand or the battlefield, so an Oracle already on the battlefield
# is excluded where it matters: the line needs it in hand
[[wish]]
cards = ["Demonic Consultation"]
when = ["have:Thassa's Oracle & not out:Thassa's Oracle & not have:Demonic Consultation"]
score = 88

[[wish]]
cards = ["Thassa's Oracle"]
when = ["have:Demonic Consultation & not have:Thassa's Oracle"]
score = 88

# Doomsday is the exile half in effect: wanted with the Oracle held, no Consultation in hand, and a way to cast it (a flash
# enabler out, or a Pile C starter in hand; the Tier 6 plan has the same enabler term)
[[wish]]
cards = ["Doomsday"]
when = ["have:Thassa's Oracle & not out:Thassa's Oracle & not have:Demonic Consultation & (out:Valley Floodcaller | out:Teferi, Time Raveler | have:Borne Upon a Wind)"]
score = 78

# the pile's starter when Doomsday and the Oracle are held and nothing yet lets the pile start: the Pile C starter is Borne
# Upon a Wind (a flash enabler out makes the end-step cast possible instead). Preordain and Brainstorm need
# not be in hand: Doomsday puts them in the pile from the library or graveyard
[[wish]]
cards = ["Borne Upon a Wind"]
when = ["have:Doomsday & have:Thassa's Oracle & not out:Thassa's Oracle & not have:Demonic Consultation & not out:Valley Floodcaller & not out:Teferi, Time Raveler & not have:Borne Upon a Wind"]
score = 58
