# Your decks: the deck key, its file under decklists/, the name the logs use, the commander the simulator
# plays and the colour identity of the seat, and `tiers`: the opponent tiers it is simulated against (matched power; see CLAUDE.md "Opponent tiers"). `format` (optional, default "commander") names a table in data/formats.toml. Extracted once from the old Python code; this file is now the source.

[sheoldred]
file = "JD/sheoldred-mono-black.md"
name = "Sheoldred"
commander = "Sheoldred, the Apocalypse"
ident = "B"
tiers = ["t3", "t4"]

