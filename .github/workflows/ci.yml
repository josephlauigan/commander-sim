# Build and test on every push and pull request.
#
# No memory cap here: CLAUDE.md's systemd-run cap protects a developer's machine, and a runner is a throwaway VM
# (a runaway fails the job instead).
name: CI

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    # No debug info in CI: the release profile's line tables (debug = 1, for profiling) made the ~240 test binaries
    # fill the runner's disk, and the linker died with a bus error (PR #221, 11/03). Overflow checks stay on.
    env:
      CARGO_PROFILE_RELEASE_DEBUG: "0"
    defaults:
      run:
        working-directory: rust
    steps:
      - uses: actions/checkout@v4
      # rust/rust-toolchain.toml pins the compiler; rustup installs it on the first cargo command
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: rust
      - name: Build
        run: cargo build --release --all-targets
      - name: Test
        run: cargo test --release
